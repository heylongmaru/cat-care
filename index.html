<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c6e7f" id="themeColorMeta">
<meta name="description" content="記錄貓咪的大小便、飲食飲水與體重，自動換算攝水量與熱量。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="貓咪日誌">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c6e7f'/%3E%3Cpath d='M18 26 18 15l8 6a20 20 0 0 1 12 0l8-6v11a17 14 0 1 1-36 0z' fill='%23fff'/%3E%3Ccircle cx='26' cy='33' r='2.6' fill='%232c6e7f'/%3E%3Ccircle cx='38' cy='33' r='2.6' fill='%232c6e7f'/%3E%3Cpath d='M32 38.5a3 3 0 0 1-3-2.2h6a3 3 0 0 1-3 2.2z' fill='%232c6e7f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c6e7f'/%3E%3Cpath d='M18 26 18 15l8 6a20 20 0 0 1 12 0l8-6v11a17 14 0 1 1-36 0z' fill='%23fff'/%3E%3Ccircle cx='26' cy='33' r='2.6' fill='%232c6e7f'/%3E%3Ccircle cx='38' cy='33' r='2.6' fill='%232c6e7f'/%3E%3Cpath d='M32 38.5a3 3 0 0 1-3-2.2h6a3 3 0 0 1-3 2.2z' fill='%232c6e7f'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<title>貓咪照護日誌</title>
<script>
/* 深色模式：在畫面繪製前先套用，避免閃白 */
(function(){
  try{
    var m = localStorage.getItem('catcare_theme') || 'auto';
    var dark = m==='dark' || (m==='auto' && window.matchMedia &&
               window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark) document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>
<style>
/* ============================================================
   design-system.css v1（內嵌）＋ 06-cat-care 專用樣式
   ============================================================ */
:root{
  --ink:#1f2a33; --text:#2a3340; --muted:#6b7683; --line:#dbe1df;
  --bg:#eef1ef; --card:#ffffff;
  --accent:#2c6e7f; --accent-soft:#e3eef0;
  --ok:#2e7d5b; --ok-soft:#e2f0e9;
  --warn:#b5761a; --warn-soft:#f6ecd9;
  --danger:#b4453c; --danger-soft:#f4e0dd;
  --radius:12px; --radius-sm:8px; --radius-lg:14px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(31,42,51,.06),0 8px 24px rgba(31,42,51,.06);
  --shadow-hover:0 6px 18px rgba(23,40,58,.08);
  --wrap:1040px; --wrap-narrow:760px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
  /* 圖示配色（可愛風：彩色圓底＋白色圖形） */
  --i-poop:#a9743f; --i-pee:#e0a43c; --i-feed:#e08a4c; --i-drink:#4aa3c4;
  --i-weight:#7b8fa8; --i-event:#d9694f; --i-supp:#7b5aa6;
}
/* ---------- 深色模式 ---------- */
html[data-theme="dark"]{
  --ink:#e9eef4; --text:#dce3ea; --muted:#93a0ae; --line:#2f3a46;
  --bg:#151a20; --card:#1d242c;
  --accent:#63b4c9; --accent-soft:#1d343c;
  --ok:#5fc79b; --ok-soft:#173028;
  --warn:#dfa95d; --warn-soft:#332810;
  --danger:#e87e72; --danger-soft:#3a201d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --shadow-hover:0 6px 18px rgba(0,0,0,.36);
  --i-poop:#b5834b; --i-pee:#e3ae4d; --i-feed:#e5975c;
  --i-drink:#57b0d1; --i-weight:#8d9fb5; --i-event:#e07a61; --i-supp:#9576c0;
  color-scheme:dark;
}
html[data-theme="dark"] .btn{border-color:var(--accent);background:var(--accent);color:#10171d}
/* 這三條的 color 一定要寫，否則會被上面那條 .btn 的深色字蓋掉，
   變成「深底＋深字」完全看不見（v1.4 的「清除本機全部資料」就中過這個） */
html[data-theme="dark"] .btn.ghost{background:var(--card);color:var(--text);border-color:var(--line)}
html[data-theme="dark"] .btn.warn{background:var(--card);color:var(--warn);border-color:var(--warn)}
html[data-theme="dark"] .btn.danger{background:var(--card);color:var(--danger);border-color:var(--danger)}
html[data-theme="dark"] .icon.danger{color:var(--danger)}
html[data-theme="dark"] .tab.active,html[data-theme="dark"] .cat-chip.active{background:var(--accent);border-color:var(--accent);color:#10171d}
/* 注意 :not(.active)：這條若把選中的也蓋掉，選中狀態的彩色底就沒了，
   結果是「深底＋深字」看不見。加狀態樣式時請沿用這個寫法。 */
html[data-theme="dark"] .opt:not(.active),
html[data-theme="dark"] .score-btn:not(.active):not(.ideal),
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea,
html[data-theme="dark"] .icon,html[data-theme="dark"] .sheet-close{background:#242c36;color:var(--text)}
html[data-theme="dark"] .opt.active{color:#10171d}
html[data-theme="dark"] .notice{border-color:#6d3b38;background:#33201e;color:#f0a49a}
html[data-theme="dark"] .toast{background:var(--accent);color:#10171d}
html[data-theme="dark"] .dirty{background:var(--warn-soft);border-color:#4a3a18;color:var(--warn)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
/* 保險：任何漏網的溢出都不該讓使用者橫向捲出去又拉不回來。
   優先用 clip（不會建立捲動容器、不影響 position:sticky/fixed）；
   舊瀏覽器退回 hidden。放 html 不放 body，底部導覽與彈窗的 fixed 定位才不受影響。
   注意：需要橫向捲的表格一律包 .tbl-scroll，它有自己的 overflow-x:auto，不受這條影響。 */
html{overflow-x:hidden}
@supports (overflow-x:clip){ html{overflow-x:clip} }
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;
  font-size:15px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  word-break:break-word;overflow-wrap:anywhere}
.wrap{max-width:var(--wrap);margin:0 auto;padding:18px 14px 110px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font-size:27px;font-weight:800;letter-spacing:-.01em;margin:6px 0 8px;color:var(--ink)}
h2{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lede{font-size:14.5px;color:var(--muted);max-width:46ch;line-height:1.6}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.muted{color:var(--muted)}
a{color:var(--accent)}
header.app{display:flex;align-items:center;gap:9px;flex-wrap:nowrap;
  padding:6px 2px 11px;border-bottom:2px solid var(--ink);margin-bottom:14px}
header.app h1{font-size:22px;letter-spacing:.5px;margin:0;display:flex;align-items:center;gap:7px;
  white-space:nowrap}
header.app .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){header.app .sub{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:9px 15px;border-radius:var(--radius-pill);cursor:pointer;font-size:15px;
  font-weight:700;transition:all .15s;font-family:inherit}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn,.btn{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;
  border-radius:var(--radius-sm);transition:all .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.warn{background:#fff;border-color:var(--warn);color:var(--warn)}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.lg{font-size:17px;padding:13px 26px}
.btn.sm{font-size:14px;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button.icon,.icon{border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:6px;cursor:pointer;padding:4px 9px;font-size:13px;font-family:inherit;transition:all .12s}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.icon.danger:hover{border-color:var(--danger);color:var(--danger)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;min-width:0;max-width:100%}
/* min-width:0 不能省：flex 子項預設 min-width:auto，會被最長的內容
   （例如下拉選單裡某個很長的貓咪名字）撐開，裡面的 max-width:100% 就失效，
   整個畫面被拉走而且捲不回來。 */
.row > *{min-width:0;max-width:100%}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;
  min-width:0;max-width:100%}
label.field select,label.field input,label.field textarea{max-width:100%}
input[type=text],input[type=date],input[type=number],input[type=month],input[type=datetime-local],select,textarea{
  font-family:inherit;font-size:16px;color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:9px 11px;background:#fff;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:64px;resize:vertical;line-height:1.5;width:100%}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:var(--radius-pill);font-size:12px;
  font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--line);margin:2px 3px 2px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
.badge.auto{background:var(--accent-soft);color:var(--accent)}
.badge.manual{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--danger-soft);color:var(--danger)}
.notice{padding:12px 15px;border:1.5px solid #e2b4b4;background:#fdf2f2;border-radius:11px;
  color:#c0392b;font-size:13.5px;line-height:1.7;font-weight:600;margin:0 0 16px}
.dirty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);
  border:1px solid #e6d3ad;color:#7a5410;border-radius:var(--radius-sm);
  padding:10px 14px;font-size:14px;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:12px 2px}
.divider{height:1px;background:var(--line);margin:14px 0}
.kpi{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.kpi div b{display:block;font-size:22px;color:var(--ink)}
.kpi div span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:11px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;
  max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}header.app h1{font-size:19px}}

/* ---------- 06-cat-care 專用 ---------- */
/* SVG 圖示：跨手機長相一致（emoji 由系統決定，SVG 由我們決定） */
.ico{display:inline-block;vertical-align:-.16em;flex:none}
.ico svg{display:block;width:100%;height:100%}
/* 圓底彩色圖示（快速打點大按鈕用，維持可愛感） */
.ico-round{display:inline-flex;align-items:center;justify-content:center;
  border-radius:34%;flex:none}
.ico-round svg{width:64%;height:64%}

/* 卡片式列表（取代手機上會斷字折行的表格） */
.item-list{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:761px){.item-list{grid-template-columns:1fr 1fr}}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--card);border-radius:var(--radius);padding:11px 12px}
.item-main{flex:1;min-width:0}
.item-name{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.35}
.item-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.item-meta .chip{margin:0;font-size:11.5px;padding:1px 8px}
.item-meta .chip.key{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.item-act{flex:none}

/* 今日頁提示卡（便祕／體重警訊） */
.alerts{display:grid;gap:8px;margin-bottom:14px}
.alert-card{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);
  padding:11px 13px;font-size:13.5px;line-height:1.6;border:1px solid}
.alert-card.warn{background:var(--warn-soft);border-color:#e6d3ad;color:#7a5410}
.alert-card.danger{background:var(--danger-soft);border-color:#e2b4b4;color:#a33c33}
html[data-theme="dark"] .alert-card.warn{border-color:#4a3a18;color:var(--warn)}
html[data-theme="dark"] .alert-card.danger{border-color:#5c2f2a;color:var(--danger)}
.alert-card b{display:block;font-weight:800;margin-bottom:1px}
.alert-card .ac-body{flex:1;min-width:0}

/* 常見市售食物挑選器 */
.fl-list{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding-right:2px}
.fl-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 11px;background:var(--card)}
.fl-main{flex:1;min-width:0}
.fl-name{font-size:14px;font-weight:800;color:var(--ink);line-height:1.35}
.fl-src{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.fl-caution{font-size:12px;color:var(--warn);font-weight:700;margin-top:5px;line-height:1.5}
.fl-act{flex:none;padding-top:2px}
.chip.src-hi{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.src-md{background:var(--bg);color:var(--muted)}

/* OCR 讀包裝標示 */
.ocr-box{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:11px 12px;margin-top:8px}
.ocr-prog{font-size:12.5px;color:var(--muted);margin-top:7px}
.ocr-hit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:13.5px}
.ocr-hit .lbl{color:var(--muted);font-weight:700;font-size:12.5px}
.ocr-raw{max-height:96px;overflow:auto;background:var(--bg);border-radius:6px;
  padding:7px 9px;font-size:11.5px;color:var(--muted);white-space:pre-wrap;margin-top:7px;line-height:1.5}

/* 貓咪選擇列 */
.cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.cat-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);padding:7px 14px;border-radius:var(--radius-pill);
  cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;transition:all .15s}
.cat-chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.cat-chip.active{border-color:var(--ink);background:var(--ink);color:#fff}
.cat-chip.small{font-size:13.5px;padding:5px 11px}

/* 快速打點大按鈕 */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;
  border:1px solid var(--line);background:var(--card);border-radius:var(--radius-lg);
  padding:16px 6px 12px;cursor:pointer;font-family:inherit;transition:all .15s;
  box-shadow:var(--shadow);min-height:84px;justify-content:center}
.quick-btn:active{transform:scale(.97)}
.quick-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-hover)}
.quick-btn .qi{width:38px;height:38px}
.quick-btn .ql{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:2px}
.quick-btn .qc{font-size:12px;color:var(--muted)}
@media(max-width:400px){.quick-btn .qi{width:33px;height:33px}.quick-btn{min-height:76px;padding:12px 4px 10px}}

/* 進度條 */
.meter{margin:10px 0 4px}
.meter .m-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  color:var(--muted);font-weight:600;margin-bottom:5px;gap:8px}
.meter .m-head b{color:var(--ink);font-size:15px}
.meter .m-track{height:12px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-pill);overflow:hidden}
.meter .m-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);
  transition:width .3s;min-width:2px}
.meter .m-fill.ok{background:var(--ok)}
.meter .m-fill.warn{background:var(--warn)}
.meter .m-note{font-size:12px;color:var(--muted);margin-top:4px}

/* 每日保健品清單 */
.supp-done{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;
  font-weight:700;color:var(--ink);padding:13px 16px}
.supp-done:hover{border-color:var(--accent)}
.supp-list{list-style:none;margin:0;padding:0}
.supp-row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.supp-row:last-child{border-bottom:none}
.supp-name{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--ink)}
.supp-note{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.supp-count{flex:none;font-size:13px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums}
.supp-count.ok{color:var(--ok)}
.supp-act{flex:none}
.supp-row.done .supp-name{color:var(--muted)}

/* 時間快捷 */
.time-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.time-picked{font-size:13px;color:var(--accent);font-weight:700;margin:6px 0 0}
.time-picked .muted{font-weight:600}

/* 今日記錄列表 */
.rec-list{list-style:none;margin:0;padding:0}
.rec-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;
  border-bottom:1px solid var(--line)}
.rec-list li:last-child{border-bottom:none}
.rec-ico{flex:none;width:26px;height:26px;margin-top:1px}
.rec-main{flex:1;min-width:0}
.rec-title{font-size:14.5px;font-weight:700;color:var(--ink)}
.rec-title .rc-cat{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.rec-sub{font-size:13px;color:var(--muted)}
.rec-sub .abn{color:var(--danger);font-weight:700}
.rec-time{font-size:12.5px;color:var(--muted);flex:none;padding-top:2px}
.rec-act{flex:none;display:flex;gap:5px}

/* 底部工具列（手機） */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:60;
  padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;
  font-size:11.5px;font-weight:700;color:var(--muted)}
.bottom-nav button .bi{width:21px;height:21px}
.bottom-nav button.active{color:var(--accent)}
@media(min-width:761px){.bottom-nav{display:none}.wrap{padding-bottom:40px}.toast{bottom:32px}}
@media(max-width:760px){.tabs{display:none}}

/* 底部彈窗（modal / bottom sheet） */
.sheet-mask{position:fixed;inset:0;background:rgba(31,42,51,.45);z-index:70;
  display:none;align-items:flex-end;justify-content:center}
.sheet-mask.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(31,42,51,.18)}
@media(min-width:761px){
  .sheet-mask{align-items:center;padding:20px}
  .sheet{border-radius:var(--radius-lg);max-height:86vh}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-head h2{font-size:18px}
.sheet-close{border:none;background:var(--bg);color:var(--muted);width:32px;height:32px;
  border-radius:50%;cursor:pointer;font-size:16px;font-weight:700;flex:none}
.sheet .sec{margin-bottom:14px}
.sheet .sec-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}

/* 選項膠囊組 */
.opt-group{display:flex;gap:7px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;color:var(--text);padding:8px 14px;
  border-radius:var(--radius-pill);cursor:pointer;font-size:14.5px;font-weight:700;
  font-family:inherit;transition:all .12s;min-height:38px}
.opt:hover{border-color:var(--accent)}
.opt.active{border-color:var(--accent);background:var(--accent);color:#fff}
.opt.ok.active{border-color:var(--ok);background:var(--ok)}
.opt.warn.active{border-color:var(--warn);background:var(--warn)}
.opt.danger.active{border-color:var(--danger);background:var(--danger)}
.opt.sm{font-size:13px;padding:5px 11px;min-height:32px}

/* 便況評分：用形狀圖對照，不必背文字 */
.score-row{display:flex;gap:5px}
.score-btn{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;
  border-radius:var(--radius-sm);padding:7px 2px 5px;text-align:center;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.score-btn .ps-shape{display:block;width:26px;height:26px;color:#9a7b58}
.score-btn .ps-shape svg{display:block;width:100%;height:100%}
.score-btn b{display:block;font-size:13px;color:var(--muted);font-weight:800;line-height:1}
.score-btn.ideal{border-color:#bcd9cb;background:var(--ok-soft)}
.score-btn.ideal b{color:var(--ok)}
.score-btn.active{border-color:var(--accent);background:var(--accent-soft);border-width:2px}
.score-btn.active b{color:var(--accent)}
.score-btn.active .ps-shape{color:var(--accent)}
html[data-theme="dark"] .score-btn:not(.active):not(.ideal){background:#242c36}
html[data-theme="dark"] .score-btn .ps-shape{color:#c39c73}
/* :not(.active) 不能省——否則「理想範圍」的綠框會蓋掉選取框，深色下看不出選了哪個 */
html[data-theme="dark"] .score-btn.ideal:not(.active){background:var(--ok-soft);border-color:#2c5a45}
.score-note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.6}
.score-note b{color:var(--ink);margin-right:7px}
.score-note .ok-tag{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:var(--radius-pill);
  background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:700}
@media(max-width:360px){.score-btn .ps-shape{width:22px;height:22px}.score-row{gap:3px}}

/* 計算預覽 */
.calc-preview{background:var(--accent-soft);border-radius:var(--radius-sm);
  padding:10px 13px;font-size:14px;color:var(--accent);font-weight:700;display:flex;
  gap:16px;flex-wrap:wrap}
.calc-preview span{color:var(--ink)}

/* 同步狀態 */
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  padding:3px 11px;border-radius:var(--radius-pill);cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--muted)}
.sync-pill .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync-pill.on .sdot{background:var(--ok)}
.sync-pill.pending .sdot{background:var(--warn)}
.sync-pill.err .sdot{background:var(--danger)}

/* 圖表 */
.chart-card svg{width:100%;height:auto;display:block}
.chart-title{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 2px}
.chart-sub{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 報告 */
.report-body h3{font-size:15px;color:var(--ink);margin:16px 0 6px;border-left:3px solid var(--accent);padding-left:8px}
.report-body table{font-size:13.5px}
.report-meta{font-size:13px;color:var(--muted)}

/* 列印 */
@media print{
  .tabs,.bottom-nav,.no-print,header.app .sub,.cat-bar,.sync-pill{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .wrap{padding:0}
}
</style>

/* icon('poop', 20) → 一段可直接塞進 HTML 的 SVG；color 預設吃 currentColor */
function icon(name, size, color){
  const p = ICONS[name] || ICONS.paw;
  const s = size || 20;
  return `<span class="ico" style="width:${s}px;height:${s}px${color?';color:'+color:''}" aria-hidden="true">`+
    `<svg viewBox="0 0 24 24" fill="currentColor">${p}</svg></span>`;
}
/* 彩色圓底版本（快速打點大按鈕用） */
function iconRound(name, size, bg){
  const p = ICONS[name] || ICONS.paw;
  const s = size || 38;
  return `<span class="ico-round" style="width:${s}px;height:${s}px;background:${bg}" aria-hidden="true">`+
    `<svg viewBox="0 0 24 24" fill="#fff">${p}</svg></span>`;
}

/* ---------- 資料層 ---------- */
/* kind（同步用的短名）→ DB 裡的陣列名。
   原本這裡是寫死的三元運算式，任何沒對到的 kind 都會默默掉進 records，
   加第四種資料時很容易中招——改成一張表，加新種類只要改這裡。 */
const KIND_MAP = { cat:'cats', food:'foods', supp:'supps', record:'records' };
const arrOf = kind => DB[KIND_MAP[kind] || 'records'];
const DEFAULT_DB = () => ({
  version:1,
  cats:[],            // {id,name,color,birthYM,neutered,derFactor,waterMlPerKg,updatedAt,deleted}
  foods:[],           // {id,name,type,moisturePct,kcalPer100g,defaultGrams,updatedAt,deleted}
  supps:[],           // {id,name,timesPerDay,note,updatedAt,deleted}  保健品／用藥（不算熱量）
  records:[],         // {id,catId,ts,type,data:{},updatedAt,deleted}
  settings:{ syncUrl:'', syncKey:'', deviceName:'', lastPullAt:0, autoSync:true }
});
let DB = DEFAULT_DB();
let PENDING = [];     // 待同步 [{kind,id}]

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw);
      DB = Object.assign(DEFAULT_DB(), d);
      DB.settings = Object.assign(DEFAULT_DB().settings, d.settings||{});
    }
    PENDING = JSON.parse(localStorage.getItem(LS_KEY+'_pending')||'[]');
  }catch(e){ console.warn('loadDB', e); }
}
function saveDB(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    localStorage.setItem(LS_KEY+'_pending', JSON.stringify(PENDING));
  }catch(e){
    toast('儲存失敗：空間可能已滿，請先到「設定」匯出備份');
    console.error(e);
  }
}
function markPending(kind,id){
  if(!PENDING.some(p=>p.kind===kind&&p.id===id)) PENDING.push({kind,id});
}
/* 寫入/更新一筆（cats/foods/records 共用），並排入同步 */
function upsert(kind, obj){
  obj.updatedAt = Date.now();
  const arr = arrOf(kind);
  const i = arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  markPending(kind, obj.id);
  saveDB();
  Sync.schedule();
}
function softDelete(kind, id){
  const arr = arrOf(kind);
  const o = arr.find(x=>x.id===id);
  if(o){ o.deleted=true; o.updatedAt=Date.now(); markPending(kind,id); saveDB(); Sync.schedule(); }
}
const liveCats  = () => DB.cats.filter(c=>!c.deleted);
const liveFoods = () => DB.foods.filter(f=>!f.deleted);
const liveSupps = () => DB.supps.filter(s=>!s.deleted);
const liveRecs  = () => DB.records.filter(r=>!r.deleted);
const catById = id => id===UNKNOWN_CAT ? {id:UNKNOWN_CAT,name:'不確定是誰',color:'#9aa4ad'} : DB.cats.find(c=>c.id===id);
const catName = id => (catById(id)||{name:'（已移除）'}).name;

/* ---------- 營養計算 ---------- */
function latestWeight(catId){
  const w = liveRecs().filter(r=>r.type==='weight'&&r.catId===catId)
    .sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
  return w ? w.data.kg : null;
}
function waterTarget(cat){          // 每日建議攝水 ml
  const kg = latestWeight(cat.id);
  if(!kg) return null;
  return Math.round(kg * (cat.waterMlPerKg || 50));
}
function kcalTarget(cat){           // DER = 70 × kg^0.75 × 係數
  const kg = latestWeight(cat.id);
  if(!kg) return null;
  return Math.round(70 * Math.pow(kg, 0.75) * (cat.derFactor || 1.2));
}
function feedCalc(food, grams){     // 一餐的水分與熱量
  return {
    waterMl: round1(grams * (food.moisturePct||0) / 100),
    kcal:    round1(grams * (food.kcalPer100g||0) / 100)
  };
}
/* 某貓某日彙總 */
function daySummary(catId, dateKey){
  const recs = liveRecs().filter(r => r.catId===catId && dkey(new Date(r.ts))===dateKey);
  const s = { poop:0, pee:0, abnormal:0, drinkMl:0, foodWaterMl:0, kcal:0, feeds:0, events:[] };
  for(const r of recs){
    if(r.type==='poop'){ s.poop++; if(r.data.status==='abnormal') s.abnormal++; }
    else if(r.type==='pee'){ s.pee++; if(r.data.colorAbn) s.abnormal++; }
    else if(r.type==='drink'){ s.drinkMl += (+r.data.ml||0); }
    else if(r.type==='feed'){ s.feeds++; s.foodWaterMl += (+r.data.waterMl||0); s.kcal += (+r.data.kcal||0); }
    else if(r.type==='event'){ s.events.push(r); s.abnormal++; }
  }
  s.drinkMl=round1(s.drinkMl); s.foodWaterMl=round1(s.foodWaterMl);
  s.totalWaterMl = round1(s.drinkMl + s.foodWaterMl); s.kcal=round1(s.kcal);
  return s;
}

/* ============================================================
   同步引擎（Google 試算表 / Apps Script）
   一次來回同時「推送本機變更＋拉回雲端變更」，updatedAt 新者勝。
   離線或未設定：靜默排隊，連上自動補傳。
   ============================================================ */
const Sync = {
  busy:false, timer:null, pollTimer:null, lastError:'',
  enabled(){ return !!(DB.settings.syncUrl && DB.settings.syncKey); },
  schedule(){                       // 存檔後 3 秒內合併送出
    this.updatePill();
    if(!this.enabled() || !DB.settings.autoSync) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>this.run(), 3000);
  },
  startPolling(){
    clearInterval(this.pollTimer);
    if(this.enabled() && DB.settings.autoSync)
      this.pollTimer = setInterval(()=>this.run(), 60000);
  },
  collectChanges(){
    const out = [];
    for(const p of PENDING){
      const arr = arrOf(p.kind);
      const o = arr.find(x=>x.id===p.id);
      if(o) out.push({ kind:p.kind, id:o.id, updatedAt:o.updatedAt||0,
        deleted:!!o.deleted, json:JSON.stringify(o) });
    }
    return out;
  },
  applyRemote(items){
    let changed = 0;
    for(const it of items){
      if(!it || !it.id) continue;
      const arr = arrOf(it.kind);
      const i = arr.findIndex(x=>x.id===it.id);
      const local = i>=0 ? arr[i] : null;
      if(local && (local.updatedAt||0) >= (it.updatedAt||0)) continue; // 本機較新
      let obj; try{ obj = JSON.parse(it.json); }catch(e){ continue; }
      obj.updatedAt = it.updatedAt; obj.deleted = !!it.deleted;
      if(i>=0) arr[i]=obj; else arr.push(obj);
      changed++;
    }
    return changed;
  },
  async run(manual){
    if(!this.enabled()){ if(manual) toast('尚未設定雲端同步'); return; }
    if(this.busy) return; this.busy=true; this.updatePill('sync');
    const sending = this.collectChanges();
    const sentIds = sending.map(x=>x.kind+'|'+x.id);
    try{
      const res = await fetch(DB.settings.syncUrl, {
        method:'POST', redirect:'follow',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },   // 避免 CORS preflight
        body: JSON.stringify({
          key: DB.settings.syncKey,
          device: DB.settings.deviceName || '未命名裝置',
          since: DB.settings.lastPullAt || 0,
          changes: sending
        })
      });
      const j = await res.json();
      if(!j || !j.ok) throw new Error(j && j.error || '伺服器回應異常');
      // 成功：清掉已送出的待同步（期間新增的保留）
      PENDING = PENDING.filter(p=>!sentIds.includes(p.kind+'|'+p.id) ||
        (()=>{ const o=arrOf(p.kind).find(x=>x.id===p.id);
               const sent=sending.find(s=>s.kind===p.kind&&s.id===p.id);
               return o && sent && (o.updatedAt||0) > sent.updatedAt; })());
      const n = this.applyRemote(j.items||[]);
      DB.settings.lastPullAt = j.serverNow || Date.now();
      this.lastError='';
      saveDB();
      if(n>0){ UI.rerender(); }
      if(manual) toast(n>0 ? `同步完成，拉回 ${n} 筆更新` : '同步完成');
    }catch(e){
      this.lastError = String(e.message||e);
      if(manual) toast('同步失敗：' + (navigator.onLine?this.lastError:'目前離線，連線後會自動補傳'));
    }finally{
      this.busy=false; this.updatePill();
      if(UI.page==='settings') Settings.renderSyncStatus();
    }
  },
  updatePill(state){
    const pill = $('#syncPill'), txt = $('#syncPillText');
    pill.className = 'sync-pill no-print';
    if(!this.enabled()){ txt.textContent='未同步'; return; }
    if(state==='sync'){ pill.classList.add('on'); txt.textContent='同步中…'; return; }
    if(this.lastError){ pill.classList.add('err'); txt.textContent='同步失敗'; return; }
    if(PENDING.length){ pill.classList.add('pending'); txt.textContent=`待同步 ${PENDING.length}`; return; }
    pill.classList.add('on'); txt.textContent='已同步';
  }
};
window.addEventListener('online', ()=>Sync.schedule());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Sync.enabled()) Sync.run(); });

/* ============================================================
   深色模式：auto（跟系統）／light／dark。
   存在 localStorage 的獨立鍵，不進同步——每台裝置各自決定。
   ============================================================ */
const THEME_KEY = 'catcare_theme';
const THEME_MODES = [
  {v:'auto',  icon:'auto', label:'跟隨系統'},
  {v:'light', icon:'sun',  label:'淺色'},
  {v:'dark',  icon:'moon', label:'深色'}
];
const Theme = {
  mode:'auto',
  systemDark(){ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); },
  isDark(){ return this.mode==='dark' || (this.mode==='auto' && this.systemDark()); },
  apply(){
    const dark=this.isDark();
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const meta=$('#themeColorMeta');
    if(meta) meta.setAttribute('content', dark?'#151a20':'#2c6e7f');
  },
  init(){
    try{ this.mode = localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){}
    this.apply();
    if(window.matchMedia){
      const mq=window.matchMedia('(prefers-color-scheme: dark)');
      const h=()=>{ if(this.mode==='auto'){ this.apply(); UI.rerender(); } };
      mq.addEventListener ? mq.addEventListener('change',h) : mq.addListener(h);
    }
  },
  set(m){
    this.mode=m;
    try{ localStorage.setItem(THEME_KEY,m); }catch(e){}
    this.apply();
    UI.rerender();
  }
};

      `<button class="tab ${p.id===this.page?'active':''}" onclick="UI.go('${p.id}')">${icon(p.icon,15)} ${p.label}</button>`).join('');
    $('#bottomNav').innerHTML = PAGES.map(p=>
      `<button class="${p.id===this.page?'active':''}" onclick="UI.go('${p.id}')"><span class="ico bi" style="width:21px;height:21px"><svg viewBox="0 0 24 24" fill="currentColor">${ICONS[p.icon]}</svg></span>${p.label}</button>`).join('');
  },
  rerender(){
    if(liveCats().length===0 && this.page!=='settings'){ Today.renderEmpty(); return; }
    if(this.page==='today') Today.render();
    else if(this.page==='history') History.render();
    else if(this.page==='stats') Stats.render();
    else if(this.page==='report') Report.render();
    else if(this.page==='settings') Settings.render();
    Sync.updatePill();
  },
  /* 貓咪選擇列（single=只能選一隻；withUnknown=多貓時加「不確定」） */
  catBar(sel, onpick, opts={}){
    const cats = liveCats();
    if(cats.length<=1 && !opts.always) return '';
    let list = cats.map(c=>
      `<button class="cat-chip ${opts.small?'small':''} ${sel===c.id?'active':''}" onclick="${onpick}('${c.id}')">
        <span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`);
    if(opts.withUnknown && cats.length>1)
      list.push(`<button class="cat-chip ${opts.small?'small':''} ${sel===UNKNOWN_CAT?'active':''}" onclick="${onpick}('${UNKNOWN_CAT}')">
        <span class="dot" style="background:#9aa4ad"></span>？不確定</button>`);
    return `<div class="cat-bar">${list.join('')}</div>`;
  }
};

/* ============================================================
   每日保健品／用藥
   ------------------------------------------------------------
   為什麼做成「清單＋打勾」而不是另一顆快速記錄按鈕：
   保健品常常是拌在飯裡一起給的，人不會特地想到要去點它——
   靠「想起來才記」一定會漏。做成今日頁上一直看得到的待辦，
   變成「它提醒你」而不是「你要記得它」。
   刻意不算熱量（使用者決定）：保健品/藥膏熱量低，要填數字反而變負擔。
   ============================================================ */
const Supp = {
  expanded:false,
  toggle(){ this.expanded=!this.expanded; UI.rerender(); },
  /* 某貓今天某項已經給了幾次 */
  countToday(suppId, catId, dateKey){
    const k = dateKey || todayKey();
    return liveRecs().filter(r=>r.type==='supp' && r.catId===catId &&
      (r.data||{}).suppId===suppId && dkey(new Date(r.ts))===k).length;
  },
  /* 今天最後一筆（用來「取消」） */
  lastToday(suppId, catId){
    return liveRecs().filter(r=>r.type==='supp' && r.catId===catId &&
        (r.data||{}).suppId===suppId && dkey(new Date(r.ts))===todayKey())
      .sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0] || null;
  },
  give(suppId, catId){
    const s = liveSupps().find(x=>x.id===suppId); if(!s) return;
    upsert('record',{ id:uid(), catId, ts:new Date().toISOString(), type:'supp',
      data:{ suppId:s.id, suppName:s.name, note:'' } });
    toast(`已記下：${s.name}`);
    UI.rerender();
  },
  undo(suppId, catId){
    const r = this.lastToday(suppId, catId);
    if(!r){ toast('今天還沒有這筆'); return; }
    softDelete('record', r.id);
    toast('已取消今天最後一筆');
    UI.rerender();
  },
  /* 今日頁卡片：沒建任何項目就整張不顯示，不打擾沒在用的人 */
  todayCard(catId){
    const list = liveSupps();
    if(!list.length || catId===UNKNOWN_CAT) return '';
    const rows = list.map(s=>{
      const need = Math.max(1, +s.timesPerDay || 1);
      const got  = this.countToday(s.id, catId);
      const done = got >= need;
      return `<li class="supp-row ${done?'done':''}">
        <span class="ico" style="width:20px;height:20px;color:${done?'var(--ok)':'var(--i-supp)'}">
          <svg viewBox="0 0 24 24" fill="currentColor">${done?ICONS.check:ICONS.pill}</svg></span>
        <span class="supp-name">${esc(s.name)}${s.note?`<span class="supp-note">${esc(s.note)}</span>`:''}</span>
        <span class="supp-count ${done?'ok':''}">${got}/${need}</span>
        <span class="supp-act">
          ${done ? `<button class="icon" onclick="Supp.undo('${s.id}','${catId}')">取消</button>`
                 : `<button class="btn sm accent" onclick="Supp.give('${s.id}','${catId}')">給了</button>`}
        </span></li>`;
    }).join('');
    const undone = list.filter(s=>this.countToday(s.id,catId) < Math.max(1,+s.timesPerDay||1)).length;
    /* 全部給完就收合成一行——每天都給完是常態，
       沒必要讓一張「已完成」的卡永遠佔著今日頁最上面那塊。 */
    if(!undone && !this.expanded){
      return `<div class="card supp-done" onclick="Supp.toggle()" role="button" tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();Supp.toggle()}">
        ${icon('check',18,'var(--ok)')}
        <span>今天的保健品／藥都給完了（${list.length} 項）</span>
        <span class="muted" style="font-size:12.5px;margin-left:auto">展開</span>
      </div>`;
    }
    return `<div class="card">
      <h2>${icon('pill',18,'var(--i-supp)')} 今天的保健品／藥
        <span class="muted" style="font-size:12.5px;font-weight:600">
          ${undone ? `還有 ${undone} 項沒給完` : '今天都給完了'}</span>
        ${!undone?`<button class="icon no-print" style="margin-left:auto" onclick="Supp.toggle()">收合</button>`:''}</h2>
      <ul class="supp-list">${rows}</ul>
      <p class="hint" style="margin:8px 0 0">忘了昨天有沒有給？到「記錄」頁用「＋ 補記」補一筆，或就讓它空著——空白本身也是資訊。</p>
    </div>`;
  }
};

/* ============================================================
   健康提醒：只在「資料足以判斷」時才出現，不嚇人也不亂猜。
   全部是觀察提醒，不是診斷——文案一律導向「請教獸醫」。
   ============================================================ */
const HOURS = 3600*1000;
const Alerts = {
  /* 距離上一次大便幾小時（沒有任何記錄回 null，代表無從判斷） */
  hoursSincePoop(catId){
    const list = liveRecs().filter(r=>r.type==='poop' && r.catId===catId)
      .sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    if(!list.length) return null;
    return (Date.now() - new Date(list[0].ts).getTime()) / HOURS;
  },
  /* 體重變化：拿最近一筆，跟 15–45 天前最接近 30 天的一筆比 */
  weightDrop(catId){
    const ws = liveRecs().filter(r=>r.type==='weight' && r.catId===catId && r.data && r.data.kg>0)
      .sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    if(ws.length<2) return null;
    const now = ws[0], nowT = new Date(now.ts).getTime();
    const cands = ws.slice(1).filter(w=>{
      const d = (nowT - new Date(w.ts).getTime()) / (24*HOURS);
      return d>=15 && d<=45;
    });
    if(!cands.length) return null;
    // 取最接近 30 天前的那筆
    cands.sort((a,b)=>Math.abs((nowT-new Date(a.ts).getTime())/(24*HOURS)-30)
                     -Math.abs((nowT-new Date(b.ts).getTime())/(24*HOURS)-30));
    const prev = cands[0];
    const pct = (prev.data.kg - now.data.kg) / prev.data.kg * 100;
    if(pct <= 5) return null;
    return { pct:round1(pct), from:prev.data.kg, to:now.data.kg,
             days:Math.round((nowT-new Date(prev.ts).getTime())/(24*HOURS)) };
  },
  list(catId){
    if(catId===UNKNOWN_CAT) return [];
    const out=[];
    const h = this.hoursSincePoop(catId);
    if(h!=null && h>=48){
      const days = Math.floor(h/24), rest = Math.floor(h%24);
      const sev = h>=72 ? 'danger' : 'warn';
      out.push({
        sev, icon:'poop',
        title: `已經 ${days} 天${rest?` ${rest} 小時`:''}沒記到大便`,
        body: sev==='danger'
          ? '超過三天沒排便，貓可能便祕或有其他問題，建議聯絡獸醫。若其實有上廁所只是忘了記，補記一筆就會消失。'
          : '貓通常一天排便 1–2 次。若確實沒上廁所，留意食慾與精神；補記漏掉的紀錄也會讓這則提醒消失。'
      });
    }
    const w = this.weightDrop(catId);
    if(w){
      out.push({
        sev: w.pct>=10 ? 'danger' : 'warn', icon:'weight',
        title: `體重 ${w.days} 天內下降 ${w.pct}%（${w.from} → ${w.to} kg）`,
        body: '貓體重短期下降常是身體狀況的早期訊號。若不是刻意減重，建議帶去給獸醫看看；若是量錯了，改掉那筆記錄即可。'
      });
    }
    return out;
  },
  html(catId){
    const list = this.list(catId);
    if(!list.length) return '';
    return `<div class="alerts">${list.map(a=>`
      <div class="alert-card ${a.sev}">
        ${icon(a.icon,18)}
        <div class="ac-body"><b>${esc(a.title)}</b>${esc(a.body)}</div>
      </div>`).join('')}</div>`;
  }
};

/* ============================================================

        <button class="btn accent lg" onclick="Settings.editCat()">＋ 新增貓咪</button>

        <div class="meter">
          <div class="m-head"><span>${icon('pee',14,'var(--i-drink)')} 總攝水（喝水 ${s.drinkMl} ＋ 食物 ${s.foodWaterMl} ml）</span>
            <b>${s.totalWaterMl} <span class="muted" style="font-size:12px;font-weight:600">/ ${wT!=null?wT+' ml':'？'}</span></b></div>

      <span class="qc">${caption}</span></button>`;
  },

/* 記錄項目共用顯示 */
const Recs = {
  describe(r){
    const d = r.data||{};
    if(r.type==='poop'){
      const shape = d.score ? `${d.score} ${(POOP_SCORES.find(s=>s.v===d.score)||{}).l||''}` : '';
      if(d.status==='abnormal'){
        const bits=[];
        if(shape) bits.push(shape);
        if(d.color && d.color!=='正常棕') bits.push(d.color);
        if(d.blood) bits.push('血絲'); if(d.mucus) bits.push('黏液');
        return {sub:bits.join('、')||'異常', abn:true};
      }
      return {sub: shape ? `正常・${shape}` : '正常', abn:false};
    }
    if(r.type==='pee'){
      const size={S:'小',M:'中',L:'大'}[d.size]||'';
      return {sub:(size?('尿塊 '+size):'')+(d.colorAbn?'、顏色/氣味異常':''), abn:!!d.colorAbn};
    }
    if(r.type==='feed'){
      return {sub:`${esc(d.foodName||'')} ${d.grams} g → 水 ${d.waterMl} ml・${d.kcal} kcal${d.leftover?`（剩 ${d.leftover} g 已扣除）`:''}`, abn:false};
    }
    if(r.type==='drink') return {sub:`${d.ml} ml${d.method==='est'?'（估計）':''}`, abn:false};
    if(r.type==='weight') return {sub:`${d.kg} kg`, abn:false};
    if(r.type==='supp') return {sub:esc(d.suppName||'保健品'), abn:false};
    if(r.type==='event') return {sub:esc(d.kind||'事件'), abn:true};
    return {sub:'',abn:false};
  },
  itemHTML(r, showDate){
    const t = REC_TYPES[r.type]||{icon:'paw',color:'var(--muted)',label:r.type};
    const {sub,abn} = this.describe(r);
    const many = liveCats().length>1;
    return `<li>
      <span class="rec-ico ico" style="color:${t.color}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor">${ICONS[t.icon]}</svg></span>
      <div class="rec-main">
        <div class="rec-title">${t.label}${many?`<span class="rc-cat">${esc(catName(r.catId))}</span>`:''}</div>
        <div class="rec-sub">${abn?`<span class="abn">${sub}</span>`:sub}${r.data&&r.data.note?`<span class="muted">・${esc(r.data.note)}</span>`:''}</div>
      </div>
      <span class="rec-time">${showDate?fmtDate(dkey(new Date(r.ts)))+' ':''}${fmtTime(r.ts)}</span>
      <span class="rec-act no-print">
        <button class="icon" onclick="Sheet.open('${r.type}','${r.id}')" title="編輯">${icon('edit',12)}</button>
        <button class="icon danger" onclick="Recs.del('${r.id}')" title="刪除">✕</button>
      </span></li>`;
  },
  del(id){
    if(!confirm('確定刪除這筆記錄？')) return;
    softDelete('record', id);
    toast('已刪除'); UI.rerender();
  }
};

/* ============================================================
   記錄彈窗（bottom sheet）：poop / pee / feed / drink / weight / event
   ============================================================ */
const Sheet = {
  cur:null,        // {type, editId, catId, form:{}}
  /* opts.dateKey：補記用。把時間定在那一天的「現在時刻」，
     使用者通常只需要再微調時分，不必從頭滑日期。 */
  open(type, editId, opts){
    const cats = liveCats();
    if(!cats.length){ toast('請先在「設定」新增貓咪'); return; }
    let form={}, catId = (UI.selCat && UI.page==='today') ? UI.selCat : cats[0].id;
    let ts = new Date().toISOString();
    if(opts && opts.dateKey && !editId){
      const [y,m,d] = opts.dateKey.split('-').map(Number);
      const now = new Date();
      ts = new Date(y, m-1, d, now.getHours(), now.getMinutes()).toISOString();
    }
    if(editId){
      const r = DB.records.find(x=>x.id===editId);
      if(!r) return;
      form = JSON.parse(JSON.stringify(r.data||{}));
      catId = r.catId; ts = r.ts; type = r.type;
    }else{
      if(type==='poop') form={status:'normal'};
      if(type==='pee')  form={size:'M'};
      if(type==='feed'){ const f=liveFoods()[0]; form={foodId:f?f.id:'', grams:f&&f.defaultGrams||'' , leftover:''}; }
      if(type==='drink') form={ml:'', method:'measure'};
      if(type==='weight'){ const kg=latestWeight(catId); form={kg: kg||''}; }
      if(type==='event') form={kind:'嘔吐'};
      if(type==='supp'){ const sp=liveSupps()[0]; form={suppId: sp?sp.id:''}; }
    }
    this.cur = {type, editId:editId||null, catId, ts, form};
    this.render();
    $('#sheetMask').classList.add('show');
    document.body.style.overflow='hidden';
  },
  close(){
    $('#sheetMask').classList.remove('show');
    document.body.style.overflow='';
    this.cur=null;
  },
  set(k,v){ this.cur.form[k]=v; this.render(); },
  setNoRender(k,v){ this.cur.form[k]=v; },
  setTs(v){ const d=new Date(v); if(!isNaN(d)) this.cur.ts=d.toISOString(); this.renderTsLabel(); },
  /* --- 時間快捷 ---
     原本補記要在原生 datetime-local 上一格一格滑，尤其「昨天」很痛苦。
     這排按鈕從「現在」往回推，最後一顆直接跳到昨天的同一時刻。 */
  TIME_QUICKS: [
    {m:0,    l:'剛剛'},
    {m:15,   l:'15 分前'},
    {m:30,   l:'30 分前'},
    {m:60,   l:'1 小時前'},
    {m:120,  l:'2 小時前'},
    {m:1440, l:'昨天這時'}
  ],
  timeQuickHTML(){
    return `<div class="time-quick">${this.TIME_QUICKS.map(q=>
      `<button class="opt sm" onclick="Sheet.tsBack(${q.m})">${q.l}</button>`).join('')}</div>`;
  },
  /* 從「現在」往回推 mins 分鐘（不是從目前選的時間再往回推，
     否則連按兩次會一直往後跑，使用者會搞不清楚基準點） */
  tsBack(mins){
    const d = new Date(Date.now() - mins*60000);
    this.cur.ts = d.toISOString();
    const el = $('#sheetBody input[type=datetime-local]');
    if(el) el.value = toLocalDT(this.cur.ts);
    this.renderTsLabel();
  },
  tsLabel(){
    const c=this.cur; if(!c) return '';
    const d=new Date(c.ts);
    const isToday = dkey(d)===todayKey();
    const y=new Date(Date.now()-86400000);
    const isYesterday = dkey(d)===dkey(y);
    const day = isToday ? '今天' : isYesterday ? '昨天' : fmtDateFull(dkey(d));
    const diffMin = Math.round((Date.now()-d.getTime())/60000);
    let ago = '';
    if(diffMin>=0 && diffMin<60) ago = diffMin<1 ? '（就是現在）' : `（${diffMin} 分鐘前）`;
    else if(diffMin>=60 && diffMin<1440) ago = `（約 ${Math.round(diffMin/60)} 小時前）`;
    else if(diffMin<0) ago = '（未來時間，確定嗎？）';
    return `記在 <b>${day} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</b> <span class="muted">${ago}</span>`;
  },
  renderTsLabel(){
    const el=$('#tsPicked'); if(el) el.innerHTML=this.tsLabel();
  },
  pickCat(id){ this.cur.catId=id; this.render(); },
  render(){
    const c = this.cur; if(!c) return;
    const t = REC_TYPES[c.type];
    const cats = liveCats();
    const allowUnknown = (c.type==='poop'||c.type==='pee');
    let body='';
    if(c.type==='poop') body=this.poopBody(c.form);
    else if(c.type==='pee') body=this.peeBody(c.form);
    else if(c.type==='feed') body=this.feedBody(c.form);
    else if(c.type==='drink') body=this.drinkBody(c.form);
    else if(c.type==='weight') body=this.weightBody(c.form);
    else if(c.type==='supp') body=this.suppBody(c.form);
    else if(c.type==='event') body=this.eventBody(c.form);

    $('#sheetBody').innerHTML = `
      <div class="sheet-head">
        <h2>${icon(t.icon,20,t.color)} ${c.editId?'編輯':''}${t.label}</h2>
        <button class="sheet-close" onclick="Sheet.close()" aria-label="關閉">✕</button>
      </div>
      ${cats.length>1 ? `<div class="sec"><div class="sec-label">哪一隻貓？</div>
        ${UI.catBar(c.catId,'Sheet.pickCat',{always:true,small:true,withUnknown:allowUnknown})}</div>`:''}
      ${body}
      <div class="sec">
        <div class="sec-label">時間</div>
        ${this.timeQuickHTML()}
        <input type="datetime-local" value="${toLocalDT(c.ts)}" style="width:100%"
          onchange="Sheet.setTs(this.value)">
        <p class="time-picked" id="tsPicked">${this.tsLabel()}</p>
      </div>
      <div class="sec">
        <div class="sec-label">備註（可空）</div>
        <textarea placeholder="想補充的觀察…" oninput="Sheet.setNoRender('note',this.value)">${esc(c.form.note||'')}</textarea>
      </div>
      <div class="row" style="justify-content:flex-end">
        ${c.editId?'<button class="btn danger" onclick="Sheet.close();Recs.del(\''+c.editId+'\')">刪除</button>':''}
        <button class="btn ghost" onclick="Sheet.close()">取消</button>
        <button class="btn accent lg" onclick="Sheet.save()">✓ 記下</button>
      </div>`;
  },
  /* --- 大便 --- */
  poopBody(f){
    const sel = POOP_SCORES.find(s=>s.v===f.score);
    return `
      <div class="sec"><div class="sec-label">狀態</div>
        <div class="opt-group">
          <button class="opt ok ${f.status==='normal'?'active':''}" onclick="Sheet.set('status','normal')">${icon('check',15)} 正常</button>
          <button class="opt danger ${f.status==='abnormal'?'active':''}" onclick="Sheet.set('status','abnormal')">${icon('event',15)} 異常</button>
        </div></div>
      <div class="sec"><div class="sec-label">形狀（可不選；1 最硬 → 7 最稀）</div>
        <div class="score-row">${POOP_SCORES.map(s=>{
          const on = f.score===s.v;
          return `<button class="score-btn ${on?'active':''} ${POOP_IDEAL.includes(s.v)?'ideal':''}"
            onclick="Sheet.set('score',${on?'null':s.v})" title="${esc(s.l)}：${esc(s.d)}" aria-label="便況 ${s.v} 分 ${esc(s.l)}">
            <span class="ps-shape" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor">${s.s}</svg></span>
            <b>${s.v}</b></button>`;}).join('')}
        </div>
        <div class="score-note">${sel
          ? `<b>${sel.v}　${esc(sel.l)}</b>${esc(sel.d)}${POOP_IDEAL.includes(sel.v)?'<span class="ok-tag">理想範圍</span>':''}`
          : '點一下形狀就記下來，再點一次取消。2–3 分是理想範圍。'}</div>
      </div>
      ${f.status==='abnormal'?`
      <div class="sec"><div class="sec-label">顏色</div>
        <div class="opt-group">${POOP_COLORS.map(cl=>
          `<button class="opt sm ${f.color===cl?'active':''}" onclick="Sheet.set('color','${cl}')">${cl}</button>`).join('')}
        </div></div>
      <div class="sec"><div class="sec-label">其他徵狀</div>
        <div class="opt-group">
          <button class="opt sm danger ${f.blood?'active':''}" onclick="Sheet.set('blood',${!f.blood})">血絲</button>
          <button class="opt sm warn ${f.mucus?'active':''}" onclick="Sheet.set('mucus',${!f.mucus})">黏液</button>
        </div></div>`:''}`;
  },
  /* --- 小便 --- */
  peeBody(f){
    return `
      <div class="sec"><div class="sec-label">尿塊大小</div>
        <div class="opt-group">
          <button class="opt ${f.size==='S'?'active':''}" onclick="Sheet.set('size','S')">小</button>
          <button class="opt ${f.size==='M'?'active':''}" onclick="Sheet.set('size','M')">中</button>
          <button class="opt ${f.size==='L'?'active':''}" onclick="Sheet.set('size','L')">大</button>
        </div></div>
      <div class="sec"><div class="sec-label">有沒有異常？</div>
        <div class="opt-group">
          <button class="opt sm danger ${f.colorAbn?'active':''}" onclick="Sheet.set('colorAbn',${!f.colorAbn})">顏色/氣味異常</button>
        </div></div>`;
  },
  /* --- 餵食 --- */
  feedBody(f){
    const foods = liveFoods();
    const food = foods.find(x=>x.id===f.foodId);
    const gross = parseFloat(f.grams)||0;
    const left  = parseFloat(f.leftover)||0;
    const net   = Math.max(0, gross-left);
    const calc  = food ? feedCalc(food, net) : null;
    const last  = this.lastFeed(this.cur.catId);
    return `
      ${last&&!this.cur.editId?`<div class="sec">
        <button class="btn sm ghost" style="width:100%" onclick="Sheet.repeatLastFeed()">
          ${icon('repeat',14)} 同上一餐：${esc(last.data.foodName||'')} ${last.data.grams} g</button>
      </div>`:''}
      <div class="sec"><div class="sec-label">吃什麼？（設定 → 食物庫可新增）</div>
        ${foods.length? `<select style="width:100%" onchange="Sheet.feedPickFood(this.value)">
          ${foods.map(x=>`<option value="${x.id}" ${x.id===f.foodId?'selected':''}>${esc(x.name)}（${esc(x.type)}・水 ${x.moisturePct}%・${x.kcalPer100g} kcal/100g）</option>`).join('')}
        </select>` : `<p class="empty" style="padding:4px 0">食物庫是空的。</p>
          <button class="btn sm accent" onclick="Sheet.close();UI.go('settings');Settings.editFood()">＋ 先新增一種食物</button>`}
      </div>
      ${foods.length?`
      <div class="sec"><div class="sec-label">給了多少（g）</div>
        <div class="row">
          <input type="number" inputmode="decimal" min="0" step="1" value="${esc(f.grams)}" placeholder="g"
            style="width:110px" oninput="Sheet.setNoRender('grams',this.value);Sheet.feedPreview()">
          <div class="opt-group">${this.feedQuickGrams(food).map(g=>
            `<button class="opt sm ${String(f.grams)===String(g)?'active':''}" onclick="Sheet.set('grams','${g}')">${g} g</button>`).join('')}
          </div></div></div>
      <div class="sec"><div class="sec-label">吃剩多少（g，可空；會從攝取扣掉）</div>
        <input type="number" inputmode="decimal" min="0" step="1" value="${esc(f.leftover)}" placeholder="0"
          style="width:110px" oninput="Sheet.setNoRender('leftover',this.value);Sheet.feedPreview()">
      </div>
      <div class="calc-preview" id="feedPreview">${calc?
        `${icon('pee',14,'var(--i-drink)')} 水分 <span>${calc.waterMl} ml</span> ${icon('fire',14,'var(--i-event)')} 熱量 <span>${calc.kcal} kcal</span>（實吃 ${net} g）`:
        '選食物並輸入克數後自動計算'}</div>`:''}`;
  },
  /* 快捷克數：跟著「目前選到的食物」走，而不是把所有食物的常用量混在一起 */
  feedQuickGrams(food){
    const d = food ? parseFloat(food.defaultGrams) : NaN;
    let list;
    if(d>0){
      list = [Math.round(d/2), Math.round(d), Math.round(d*1.5), Math.round(d*2)];
    }else{
      const t = food ? food.type : '';
      list = (t==='主食罐') ? [40,70,85,100]
           : (t==='副食罐/餐包') ? [35,50,70,85]
           : (t==='零食') ? [2,5,10,15]
           : (t==='鮮食/自製') ? [40,60,80,100]
           : [10,20,30,50];
    }
    return list.filter(v=>v>0).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
  },
  /* 這隻貓最近一筆餵食 */
  lastFeed(catId){
    return liveRecs().filter(r=>r.type==='feed' && r.catId===catId)
      .sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0] || null;
  },
  repeatLastFeed(){
    const r = this.lastFeed(this.cur.catId);
    if(!r){ toast('還沒有上一餐可以帶入'); return; }
    const food = liveFoods().find(f=>f.id===(r.data||{}).foodId);
    if(!food){ toast('上一餐的食物已從食物庫移除，請重新選一個'); return; }
    this.cur.form.foodId = food.id;
    this.cur.form.grams  = r.data.grams;
    this.cur.form.leftover = '';
    this.render();
    toast(`已帶入：${food.name} ${r.data.grams} g`);
  },
  feedPickFood(id){
    const f = liveFoods().find(x=>x.id===id);
    this.cur.form.foodId=id;
    if(f && f.defaultGrams && !this.cur.form.grams) this.cur.form.grams=f.defaultGrams;
    this.render();
  },
  feedPreview(){
    const f=this.cur.form;
    const food=liveFoods().find(x=>x.id===f.foodId);
    const net=Math.max(0,(parseFloat(f.grams)||0)-(parseFloat(f.leftover)||0));
    const el=$('#feedPreview'); if(!el) return;
    if(food){ const c=feedCalc(food,net);
      el.innerHTML=`${icon('pee',14,'var(--i-drink)')} 水分 <span>${c.waterMl} ml</span> ${icon('fire',14,'var(--i-event)')} 熱量 <span>${c.kcal} kcal</span>（實吃 ${net} g）`; }
  },
  /* --- 喝水 --- */
  drinkBody(f){
    return `
      <div class="sec"><div class="sec-label">喝了多少（ml）</div>
        <div class="row">
          <input type="number" inputmode="decimal" min="0" step="1" value="${esc(f.ml)}" placeholder="ml"
            style="width:110px" oninput="Sheet.setNoRender('ml',this.value)">
          <div class="opt-group">${[5,10,20,30,50].map(v=>
            `<button class="opt sm" onclick="Sheet.set('ml','${v}')">${v}</button>`).join('')}
          </div></div>
        <p class="hint" style="margin:8px 0 0">量法：有刻度的水碗直接讀，或整碗秤重（1 g ≈ 1 ml），換水時記差值。</p>
      </div>
      <div class="sec"><div class="sec-label">這個數字是？</div>
        <div class="opt-group">
          <button class="opt sm ${f.method!=='est'?'active':''}" onclick="Sheet.set('method','measure')">實際量測</button>
          <button class="opt sm ${f.method==='est'?'active':''}" onclick="Sheet.set('method','est')">大概估計</button>
        </div></div>`;
  },
  /* --- 體重 --- */
  weightBody(f){
    const last = latestWeight(this.cur.catId);
    return `
      <div class="sec"><div class="sec-label">體重（kg）</div>
        <input type="number" inputmode="decimal" min="0" step="0.01" value="${esc(f.kg)}" placeholder="例如 4.20"
          style="width:140px" oninput="Sheet.setNoRender('kg',this.value)">
        ${last?`<p class="hint" style="margin:8px 0 0">上次記錄：${last} kg</p>`:''}
        <p class="hint" style="margin:4px 0 0">量法：抱貓一起站上體重計再減自己，或用寵物秤。</p>
        <p class="hint" style="margin:4px 0 0">不用每天量——攝水與熱量的建議值會自動沿用最近一次體重（建議每週量一次就好）。</p>
      </div>`;
  },
  /* --- 保健品／藥 --- */
  suppBody(f){
    const list = liveSupps();
    if(!list.length) return `<div class="sec"><p class="empty" style="padding:4px 0">
      還沒有建立任何保健品／藥。</p>
      <button class="btn sm accent" onclick="Sheet.close();UI.go('settings');Settings.editSupp()">＋ 先去建立一項</button></div>`;
    return `<div class="sec"><div class="sec-label">給了什麼？</div>
      <div class="opt-group">${list.map(x=>
        `<button class="opt sm ${f.suppId===x.id?'active':''}" onclick="Sheet.set('suppId','${x.id}')">${esc(x.name)}</button>`).join('')}</div>
      <p class="hint" style="margin:8px 0 0">保健品不計入熱量統計，只記「有沒有給」。</p></div>`;
  },
  /* --- 異常/事件 --- */
  eventBody(f){
    return `
      <div class="sec"><div class="sec-label">發生什麼事？</div>
        <div class="opt-group">${EVENT_KINDS.map(k=>
          `<button class="opt ${f.kind===k?'active':''}" onclick="Sheet.set('kind','${k}')">${k}</button>`).join('')}
        </div>
        <p class="hint" style="margin:8px 0 0">軟便、拉肚子請用「大便 → 異常」記，統計才算得準。</p>
      </div>`;
  },
  /* --- 存檔 --- */
  save(){
    const c=this.cur; if(!c) return;
    const f=c.form;
    if(c.catId===UNKNOWN_CAT && !(c.type==='poop'||c.type==='pee')){
      toast('「不確定是誰」只能用在大小便記錄'); return;
    }
    let data={ note:(f.note||'').trim() };
    if(c.type==='poop'){
      data.status=f.status||'normal';
      data.score=f.score||null;                       // 形狀正常時也可以記
      if(data.status==='abnormal'){ data.color=f.color||null;
        data.blood=!!f.blood; data.mucus=!!f.mucus; }
    }else if(c.type==='pee'){
      data.size=f.size||'M'; data.colorAbn=!!f.colorAbn;
    }else if(c.type==='feed'){
      const food=liveFoods().find(x=>x.id===f.foodId);
      if(!food){ toast('請先選擇食物'); return; }
      const gross=parseFloat(f.grams);
      if(!(gross>0)){ toast('請輸入克數'); return; }
      const left=Math.min(gross, Math.max(0,parseFloat(f.leftover)||0));
      const net=round1(gross-left);
      const calc=feedCalc(food,net);
      data.foodId=food.id; data.foodName=food.name; data.grams=gross;
      data.leftover=left||0; data.netGrams=net;
      data.waterMl=calc.waterMl; data.kcal=calc.kcal;
    }else if(c.type==='drink'){
      const ml=parseFloat(f.ml);
      if(!(ml>0)){ toast('請輸入毫升數'); return; }
      data.ml=ml; data.method=f.method||'measure';
    }else if(c.type==='weight'){
      const kg=parseFloat(f.kg);
      if(!(kg>0&&kg<30)){ toast('請輸入合理的體重（kg）'); return; }
      data.kg=kg;
    }else if(c.type==='supp'){
      const sp=liveSupps().find(x=>x.id===f.suppId);
      if(!sp){ toast('請選擇保健品／藥'); return; }
      data.suppId=sp.id; data.suppName=sp.name;
    }else if(c.type==='event'){
      data.kind=f.kind||'其他';
    }
    const rec = c.editId ? DB.records.find(x=>x.id===c.editId) : { id:uid() };
    rec.catId=c.catId; rec.ts=c.ts; rec.type=c.type; rec.data=data;
    upsert('record', rec);
    this.close();
    toast(`已記下：${REC_TYPES[c.type].label} ✓`);
    UI.rerender();
  }
};
$('#sheetMask').addEventListener('click', e=>{ if(e.target.id==='sheetMask') Sheet.close(); });

/* ============================================================
   補記：先選哪一天，再選記什麼。
   原本要補昨天的記錄，得開彈窗、在原生 datetime-local 上把日期滑回去，
   麻煩到讓人乾脆不補——先問日期就少掉那一步。
   ============================================================ */
const Backfill = {
  dateKey:null,
  open(){
    this.dateKey = dkey(new Date(Date.now()-86400000));   // 預設昨天，補記最常見的情境
    this.render();
    $('#sheetMask').classList.add('show'); document.body.style.overflow='hidden';
  },
  setDate(k){ this.dateKey=k; this.render(); },
  dayChips(){
    const out=[];
    for(let i=0;i<4;i++){
      const d=new Date(Date.now()-i*86400000), k=dkey(d);
      const l = i===0?'今天' : i===1?'昨天' : i===2?'前天' : fmtDate(k);
      out.push(`<button class="opt sm ${this.dateKey===k?'active':''}" onclick="Backfill.setDate('${k}')">${l}</button>`);
    }
    return out.join('');
  },
  render(){
    const types = Object.entries(REC_TYPES).filter(([k])=> k!=='supp' || liveSupps().length);
    $('#sheetBody').innerHTML=`
      <div class="sheet-head"><h2>${icon('list',20,'var(--accent)')} 補記</h2>
        <button class="sheet-close" onclick="Sheet.close()" aria-label="關閉">✕</button></div>
      <div class="sec"><div class="sec-label">補哪一天？</div>
        <div class="opt-group">${this.dayChips()}</div>
        <input type="date" value="${esc(this.dateKey)}" max="${todayKey()}" style="width:100%;margin-top:8px"
          onchange="Backfill.setDate(this.value)">
      </div>
      <div class="sec"><div class="sec-label">記什麼？</div>
        <div class="quick-grid">${types.map(([k,t])=>
          `<button class="quick-btn" onclick="Backfill.pick('${k}')">
            <span class="qi ico-round" style="background:${t.color}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff">${ICONS[t.icon]}</svg></span>
            <span class="ql">${t.label}</span></button>`).join('')}</div>
      </div>
      <p class="hint">時間會先帶到那天的現在時刻，開了之後可以再用快捷鍵或直接改。</p>`;
  },
  pick(type){
    const k=this.dateKey;
    Sheet.close();
    setTimeout(()=>Sheet.open(type, null, {dateKey:k}), 30);
  }
};

/* ============================================================
   記錄頁（歷史列表）
   ============================================================ */
const History = {
  filterType:'all', filterCat:'all', days:7,
  render(){
    const cats = liveCats();
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-this.days+1); cutoff.setHours(0,0,0,0);
    let recs = liveRecs().filter(r=>new Date(r.ts)>=cutoff);
    if(this.filterType!=='all') recs = recs.filter(r=>r.type===this.filterType);
    if(this.filterCat!=='all') recs = recs.filter(r=>r.catId===this.filterCat);
    recs.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    const byDay={};
    for(const r of recs){ const k=dkey(new Date(r.ts)); (byDay[k]=byDay[k]||[]).push(r); }
    const dayKeys=Object.keys(byDay).sort().reverse();

    $('#page-history').innerHTML = `
      <div class="card no-print">
        <div class="row">
          <label class="field">範圍
            <select onchange="History.days=+this.value;History.render()">
              ${[7,14,30,90].map(d=>`<option value="${d}" ${this.days===d?'selected':''}>近 ${d} 天</option>`).join('')}
            </select></label>
          <label class="field">類型
            <select onchange="History.filterType=this.value;History.render()">
              <option value="all">全部</option>
              ${Object.entries(REC_TYPES).map(([k,t])=>`<option value="${k}" ${this.filterType===k?'selected':''}>${t.label}</option>`).join('')}
            </select></label>
          ${cats.length>1?`<label class="field">貓咪
            <select onchange="History.filterCat=this.value;History.render()">
              <option value="all">全部</option>
              ${cats.map(c=>`<option value="${c.id}" ${this.filterCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
              <option value="${UNKNOWN_CAT}" ${this.filterCat===UNKNOWN_CAT?'selected':''}>？不確定</option>
            </select></label>`:''}
        </div>
        <div class="divider"></div>
        <button class="btn sm accent" onclick="Backfill.open()">＋ 補記（漏掉的、想不起來當下沒點的）</button>
      </div>
      ${dayKeys.length? dayKeys.map(k=>`
        <div class="card">
          <h2>${fmtDateFull(k)} <span class="muted" style="font-size:12.5px;font-weight:600">${byDay[k].length} 筆</span></h2>
          <ul class="rec-list">${byDay[k].map(r=>Recs.itemHTML(r)).join('')}</ul>
        </div>`).join('')
      : '<div class="card"><p class="empty">這個範圍內沒有符合的記錄。</p></div>'}`;
  }
};

/* ============================================================
   統計頁（SVG 圖表）
   ============================================================ */
const Chart = {
  /* 並排長條圖：series=[{label,color,values[]}], labels=[] */
  bars(labels, series, opts={}){
    const W=640, H=200, padL=34, padB=26, padT=10, padR=6;
    const iw=W-padL-padR, ih=H-padT-padB;
    const maxV=Math.max(1, ...series.flatMap(s=>s.values), opts.minMax||0);
    const step=iw/labels.length;
    const bw=Math.min(16,(step-6)/series.length);
    const y=v=>padT+ih-(v/maxV)*ih;
    let g='';
    const ticks=this.ticks(maxV);
    for(const t of ticks) g+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#6b7683">${t}</text>`;
    series.forEach((s,si)=>{ s.values.forEach((v,i)=>{
      const x=padL+step*i+step/2-(bw*series.length)/2+si*bw;
      if(v>0) g+=`<rect x="${x}" y="${y(v)}" width="${bw-1.5}" height="${Math.max(1,padT+ih-y(v))}" rx="2" fill="${s.color}"/>`;
    });});
    g+=this.xLabels(labels,padL,step,H,'bar');
    return this.svg(W,H,g);
  },
  /* 折線圖：points=[{x label,y value|null}]，可加 target 水平線 */
  line(labels, values, color, opts={}){
    const W=640, H=200, padL=40, padB=26, padT=10, padR=8;
    const iw=W-padL-padR, ih=H-padT-padB;
    const vals=values.filter(v=>v!=null);
    if(!vals.length) return '<p class="empty">尚無資料</p>';
    let maxV=Math.max(...vals, opts.target||0), minV=Math.min(...vals, opts.target||Infinity);
    if(opts.zeroBase){ minV=0; }
    const span=(maxV-minV)||1; maxV+=span*0.12; if(!opts.zeroBase) minV-=span*0.12;
    const step=iw/Math.max(1,labels.length-1);
    const x=i=>padL+(labels.length===1?iw/2:step*i);
    const y=v=>padT+ih-((v-minV)/(maxV-minV))*ih;
    let g='';
    const ticks=this.ticks(maxV,minV);
    for(const t of ticks) g+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#6b7683">${t%1?t.toFixed(1):t}</text>`;
    if(opts.target) g+=`<line x1="${padL}" y1="${y(opts.target)}" x2="${W-padR}" y2="${y(opts.target)}" stroke="#b5761a" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W-padR}" y="${y(opts.target)-5}" text-anchor="end" font-size="10" fill="#b5761a" font-weight="700">目標 ${opts.target}${opts.unit||''}</text>`;
    let path='', started=false;
    values.forEach((v,i)=>{ if(v==null){started=false;return;}
      path+=(started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; started=true; });
    g+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    values.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${color}"/>`; });
    g+=this.xLabels(labels,padL,iw/Math.max(1,labels.length-1),H,'point');
    return this.svg(W,H,g);
  },
  ticks(maxV,minV=0){
    const span=maxV-minV||1;
    const raw=span/4;
    const mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const nice=[1,2,2.5,5,10].map(m=>m*mag).find(m=>m>=raw)||mag*10;
    const out=[]; const start=Math.ceil(minV/nice)*nice;
    for(let t=start;t<=maxV+1e-9;t+=nice) out.push(round1(t));
    return out.slice(0,7);
  },
  /* mode: 'bar'＝標籤置於分組中央；'point'＝標籤對齊資料點 */
  xLabels(labels,padL,step,H,mode){
    const n=labels.length, every=Math.ceil(n/8);
    let g='';
    labels.forEach((l,i)=>{ if(i%every) return;
      let x = mode==='bar' ? padL+step*i+step/2
            : (n===1 ? padL+step/2 : padL+step*i);
      x = Math.min(Math.max(x,18), 640-18);   // 夾住，避免最右標籤被切掉
      g+=`<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7683">${l}</text>`; });
    return g;
  },
  svg(W,H,inner){ return `<svg viewBox="0 0 ${W} ${H}" role="img">${inner}</svg>`; }
};

const Stats = {

    const cats=liveCats();

    const cat=catById(this.selCat);
    /* 日期軸 */
    const keys=[]; const d=new Date(); d.setDate(d.getDate()-this.days+1);
    for(let i=0;i<this.days;i++){ keys.push(dkey(d)); d.setDate(d.getDate()+1); }
    const labels=keys.map(fmtDate);
    const sums=keys.map(k=>daySummary(cat.id,k));

    const wRecs=liveRecs().filter(r=>r.type==='weight'&&r.catId===cat.id)
      .sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const wCut=new Date(); wCut.setDate(wCut.getDate()-90);
    const wPts=wRecs.filter(r=>new Date(r.ts)>=wCut);

        <p class="chart-title">${icon('poop',15,'var(--i-poop)')} 大小便次數（次/日）</p>
        <p class="chart-sub">${esc(cat.name)}・近 ${this.days} 天</p>
        ${Chart.bars(labels,[
          {label:'大便',color:'#b5761a',values:sums.map(s=>s.poop)},

          <span><i style="background:#2c6e7f"></i>小便</span></div>

/* ============================================================
   報告頁（給獸醫看的期間摘要）
   ============================================================ */
const Report = {
  selCat:null, from:null, to:null,
  render(){
    const cats=liveCats();
    if(!this.selCat||!cats.some(c=>c.id===this.selCat)) this.selCat=cats[0].id;
    if(!this.to) this.to=todayKey();
    if(!this.from){ const d=new Date(); d.setDate(d.getDate()-13); this.from=dkey(d); }
    $('#page-report').innerHTML = `
      <div class="card no-print">
        <h2>${icon('report',18,'var(--accent)')} 獸醫報告</h2>
        <p class="hint">選期間產生摘要，可直接列印／存 PDF 帶去診間，或複製文字傳 LINE。</p>
        ${UI.catBar(this.selCat,'Report.pickCat')}
        <div class="row">
          <label class="field">從 <input type="date" value="${this.from}" onchange="Report.from=this.value"></label>
          <label class="field">到 <input type="date" value="${this.to}" onchange="Report.to=this.value"></label>
          <button class="btn accent" onclick="Report.build()">產生報告</button>
        </div>
      </div>
      <div id="reportOut"></div>`;
    this.build();
  },
  pickCat(id){ if(id===UNKNOWN_CAT) return; this.selCat=id; this.render(); },
  rangeKeys(){
    const out=[]; const d=new Date(this.from+'T00:00'); const end=new Date(this.to+'T00:00');
    if(d>end) return out;
    while(d<=end && out.length<400){ out.push(dkey(d)); d.setDate(d.getDate()+1); }
    return out;
  },
  build(){
    const cat=catById(this.selCat); if(!cat) return;
    const keys=this.rangeKeys();
    if(!keys.length){ $('#reportOut').innerHTML='<div class="card"><p class="empty">日期範圍不正確。</p></div>'; return; }
    const sums=keys.map(k=>daySummary(cat.id,k));
    const n=keys.length;
    const avg=f=>round1(sums.reduce((a,s)=>a+f(s),0)/n);
    const wRecs=liveRecs().filter(r=>r.type==='weight'&&r.catId===cat.id&&
        dkey(new Date(r.ts))>=this.from&&dkey(new Date(r.ts))<=this.to)
      .sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    /* 異常明細 */
    const abnRecs=liveRecs().filter(r=>{
      const k=dkey(new Date(r.ts));
      if(k<this.from||k>this.to||r.catId!==cat.id) return false;
      return (r.type==='poop'&&r.data.status==='abnormal')||(r.type==='pee'&&r.data.colorAbn)||r.type==='event';
    }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const wT=waterTarget(cat), kT=kcalTarget(cat);
    const kgNow=latestWeight(cat.id);

    const html = `
      <div class="card report-body" id="reportCard">
        <h2>${icon('paw',18,'var(--accent)')} ${esc(cat.name)}・照護摘要</h2>
        <p class="report-meta">期間：${this.from} ～ ${this.to}（${n} 天）・產出日：${todayKey()}
          ${kgNow?`・目前體重 ${kgNow} kg`:''}</p>
        <h3>每日平均</h3>
        <div class="kpi">
          <div><b>${avg(s=>s.poop)}</b><span>大便 次/日</span></div>
          <div><b>${avg(s=>s.pee)}</b><span>小便 次/日</span></div>
          <div><b>${Math.round(avg(s=>s.totalWaterMl))}</b><span>總攝水 ml/日${wT?`（建議 ${wT}）`:''}</span></div>
          <div><b>${Math.round(avg(s=>s.kcal))}</b><span>熱量 kcal/日${kT?`（需求約 ${kT}）`:''}</span></div>
        </div>
        <h3>逐日紀錄</h3>
        <div class="tbl-scroll"><table>
          <tr><th>日期</th><th>大便</th><th>小便</th><th>喝水 ml</th><th>食物水 ml</th><th>總攝水 ml</th><th>熱量 kcal</th><th>異常</th></tr>
          ${keys.map((k,i)=>{const s=sums[i];
            return `<tr><td>${fmtDate(k)}</td><td>${s.poop||'·'}</td><td>${s.pee||'·'}</td>
              <td>${s.drinkMl||'·'}</td><td>${s.foodWaterMl||'·'}</td><td>${s.totalWaterMl||'·'}</td>
              <td>${s.kcal||'·'}</td><td>${s.abnormal?`<span style="color:var(--danger);font-weight:700">${s.abnormal}</span>`:'·'}</td></tr>`;}).join('')}
        </table></div>
        <h3>異常明細（${abnRecs.length} 筆）</h3>
        ${abnRecs.length?`<ul class="rec-list">${abnRecs.map(r=>Recs.itemHTML(r,true)).join('')}</ul>`
          :'<p class="empty">期間內沒有記到異常。</p>'}
        ${(()=>{
          const supps=liveSupps();
          if(!supps.length) return '';
          const rows=supps.map(sp=>{
            const need=Math.max(1,+sp.timesPerDay||1);
            const per=keys.map(k=>Supp.countToday(sp.id,cat.id,k));
            const total=per.reduce((a,b)=>a+b,0);
            const full=per.filter(v=>v>=need).length;
            return `<tr><td>${esc(sp.name)}</td><td>每天 ${need} 次</td><td>${total} 次</td>
              <td>${full}/${n} 天</td></tr>`;
          }).join('');
          return `<h3>保健品／用藥</h3>
            <div class="tbl-scroll"><table>
              <tr><th>項目</th><th>應給</th><th>期間共記錄</th><th>達標天數</th></tr>${rows}
            </table></div>
            <p class="hint">「達標天數」＝當天記到的次數有達到設定次數的天數。沒記到不等於沒給，也可能是忘了記。</p>`;
        })()}
        <h3>體重記錄</h3>
        ${wRecs.length?`<div class="tbl-scroll"><table><tr><th>日期</th><th>體重 kg</th><th>變化</th></tr>
          ${wRecs.map((r,i)=>{const prev=i>0?wRecs[i-1].data.kg:null;
            const diff=prev!=null?round1(r.data.kg-prev):null;
            return `<tr><td>${fmtDate(dkey(new Date(r.ts)))}</td><td>${r.data.kg}</td>
              <td>${diff==null?'—':(diff>0?'+':'')+diff}</td></tr>`;}).join('')}</table></div>`
          :'<p class="empty">期間內沒有體重記錄。</p>'}
        <p class="hint" style="margin-top:14px">＊攝水與熱量依食物庫的含水量/熱量設定換算，僅供參考；診斷請以獸醫檢查為準。</p>
      </div>
      <div class="row no-print" style="margin-bottom:16px">
        <button class="btn accent" onclick="window.print()">${icon('print',15)} 列印 / 存 PDF</button>
        <button class="btn ghost" onclick="Report.copyText()">${icon('copy',15)} 複製文字摘要</button>
      </div>`;
    $('#reportOut').innerHTML=html;
  },
  copyText(){
    const cat=catById(this.selCat);
    const keys=this.rangeKeys(); const n=keys.length;
    const sums=keys.map(k=>daySummary(cat.id,k));
    const avg=f=>round1(sums.reduce((a,s)=>a+f(s),0)/n);
    const kgNow=latestWeight(cat.id);
    const abnLines=[];
    keys.forEach((k,i)=>{ const s=sums[i];
      if(s.abnormal>0) abnLines.push(`  ${fmtDate(k)}：異常 ${s.abnormal} 筆`); });
    const txt=[
      `🐾 ${cat.name} 照護摘要（${this.from}～${this.to}）`,
      kgNow?`目前體重：${kgNow} kg`:null,
      `平均每日：大便 ${avg(s=>s.poop)} 次、小便 ${avg(s=>s.pee)} 次`,
      `平均攝水：${Math.round(avg(s=>s.totalWaterMl))} ml/日（喝水＋食物水分）`,
      `平均熱量：${Math.round(avg(s=>s.kcal))} kcal/日`,
      abnLines.length?`異常日：\n${abnLines.join('\n')}`:'期間內無異常記錄',
      `（由貓咪照護日誌產出，數值依食物庫設定換算、僅供參考）`
    ].filter(Boolean).join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast('已複製，可貼到 LINE'))
      .catch(()=>{ prompt('手動複製：', txt); });
  }
};
