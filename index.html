/* ============================================================
   統計頁（SVG 圖表）
   ============================================================ */
const Chart = {
  /* 並排長條圖：series=[{label,color,values[]}], labels=[] */
  bars(labels, series, opts={}){
    const W=640, H=200, padL=34, padB=26, padT=10, padR=6;
    const iw=W-padL-padR, ih=H-padT-padB;
    const maxV=Math.max(1, ...series.flatMap(s=>s.values), opts.minMax||0);
    const step=iw/labels.length;
    const bw=Math.min(16,(step-6)/series.length);
    const y=v=>padT+ih-(v/maxV)*ih;
    let g='';
    const ticks=this.ticks(maxV);
    for(const t of ticks) g+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#6b7683">${t}</text>`;
    series.forEach((s,si)=>{ s.values.forEach((v,i)=>{
      const x=padL+step*i+step/2-(bw*series.length)/2+si*bw;
      if(v>0) g+=`<rect x="${x}" y="${y(v)}" width="${bw-1.5}" height="${Math.max(1,padT+ih-y(v))}" rx="2" fill="${s.color}"/>`;
    });});
    g+=this.xLabels(labels,padL,step,H,'bar');
    return this.svg(W,H,g);
  },
  /* 折線圖：points=[{x label,y value|null}]，可加 target 水平線 */
  line(labels, values, color, opts={}){
    const W=640, H=200, padL=40, padB=26, padT=10, padR=8;
    const iw=W-padL-padR, ih=H-padT-padB;
    const vals=values.filter(v=>v!=null);
    if(!vals.length) return '<p class="empty">尚無資料</p>';
    let maxV=Math.max(...vals, opts.target||0), minV=Math.min(...vals, opts.target||Infinity);
    if(opts.zeroBase){ minV=0; }
    const span=(maxV-minV)||1; maxV+=span*0.12; if(!opts.zeroBase) minV-=span*0.12;
    const step=iw/Math.max(1,labels.length-1);
    const x=i=>padL+(labels.length===1?iw/2:step*i);
    const y=v=>padT+ih-((v-minV)/(maxV-minV))*ih;
    let g='';
    const ticks=this.ticks(maxV,minV);
    for(const t of ticks) g+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#6b7683">${t%1?t.toFixed(1):t}</text>`;
    if(opts.target) g+=`<line x1="${padL}" y1="${y(opts.target)}" x2="${W-padR}" y2="${y(opts.target)}" stroke="#b5761a" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W-padR}" y="${y(opts.target)-5}" text-anchor="end" font-size="10" fill="#b5761a" font-weight="700">目標 ${opts.target}${opts.unit||''}</text>`;
    let path='', started=false;
    values.forEach((v,i)=>{ if(v==null){started=false;return;}
      path+=(started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; started=true; });
    g+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    values.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${color}"/>`; });
    g+=this.xLabels(labels,padL,iw/Math.max(1,labels.length-1),H,'point');
    return this.svg(W,H,g);
  },
  ticks(maxV,minV=0){
    const span=maxV-minV||1;
    const raw=span/4;
    const mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const nice=[1,2,2.5,5,10].map(m=>m*mag).find(m=>m>=raw)||mag*10;
    const out=[]; const start=Math.ceil(minV/nice)*nice;
    for(let t=start;t<=maxV+1e-9;t+=nice) out.push(round1(t));
    return out.slice(0,7);
  },
  /* mode: 'bar'＝標籤置於分組中央；'point'＝標籤對齊資料點 */
  xLabels(labels,padL,step,H,mode){
    const n=labels.length, every=Math.ceil(n/8);
    let g='';
    labels.forEach((l,i)=>{ if(i%every) return;
      let x = mode==='bar' ? padL+step*i+step/2
            : (n===1 ? padL+step/2 : padL+step*i);
      x = Math.min(Math.max(x,18), 640-18);   // 夾住，避免最右標籤被切掉
      g+=`<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7683">${l}</text>`; });
    return g;
  },
  svg(W,H,inner){ return `<svg viewBox="0 0 ${W} ${H}" role="img">${inner}</svg>`; }
};

/* ============================================================
   報告頁（給獸醫看的期間摘要）
   ============================================================ */
const Report = {
  selCat:null, from:null, to:null,
  render(){
    const cats=liveCats();
    if(!this.selCat||!cats.some(c=>c.id===this.selCat)) this.selCat=cats[0].id;
    if(!this.to) this.to=todayKey();
    if(!this.from){ const d=new Date(); d.setDate(d.getDate()-13); this.from=dkey(d); }
    $('#page-report').innerHTML = `
      <div class="card no-print">
        <h2>${icon('report',18,'var(--accent)')} 獸醫報告</h2>
        <p class="hint">選期間產生摘要，可直接列印／存 PDF 帶去診間，或複製文字傳 LINE。</p>
        ${UI.catBar(this.selCat,'Report.pickCat')}
        <div class="row">
          <label class="field">從 <input type="date" value="${this.from}" onchange="Report.from=this.value"></label>
          <label class="field">到 <input type="date" value="${this.to}" onchange="Report.to=this.value"></label>
          <button class="btn accent" onclick="Report.build()">產生報告</button>
        </div>
      </div>
      <div id="reportOut"></div>`;
    this.build();
  },
  pickCat(id){ if(id===UNKNOWN_CAT) return; this.selCat=id; this.render(); },
  rangeKeys(){
    const out=[]; const d=new Date(this.from+'T00:00'); const end=new Date(this.to+'T00:00');
    if(d>end) return out;
    while(d<=end && out.length<400){ out.push(dkey(d)); d.setDate(d.getDate()+1); }
    return out;
  },
  build(){
    const cat=catById(this.selCat); if(!cat) return;
    const keys=this.rangeKeys();
    if(!keys.length){ $('#reportOut').innerHTML='<div class="card"><p class="empty">日期範圍不正確。</p></div>'; return; }
    const sums=keys.map(k=>daySummary(cat.id,k));
    const n=keys.length;
    const avg=f=>round1(sums.reduce((a,s)=>a+f(s),0)/n);
    const wRecs=liveRecs().filter(r=>r.type==='weight'&&r.catId===cat.id&&
        dkey(new Date(r.ts))>=this.from&&dkey(new Date(r.ts))<=this.to)
      .sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    /* 異常明細 */
    const abnRecs=liveRecs().filter(r=>{
      const k=dkey(new Date(r.ts));
      if(k<this.from||k>this.to||r.catId!==cat.id) return false;
      return (r.type==='poop'&&r.data.status==='abnormal')||(r.type==='pee'&&r.data.colorAbn)||r.type==='event';
    }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const wT=waterTarget(cat), kT=kcalTarget(cat);
    const kgNow=latestWeight(cat.id);
    const suppAgg=this.suppSummary(cat.id);

    const html = `
      <div class="card report-body" id="reportCard">
        <h2>${icon('paw',18,'var(--accent)')} ${esc(cat.name)}・照護摘要</h2>
        <p class="report-meta">期間：${this.from} ～ ${this.to}（${n} 天）・產出日：${todayKey()}
          ${kgNow?`・目前體重 ${kgNow} kg`:''}</p>
        <h3>每日平均</h3>
        <div class="kpi">
          <div><b>${avg(s=>s.poop)}</b><span>大便 次/日</span></div>
          <div><b>${avg(s=>s.pee)}</b><span>小便 次/日</span></div>
          <div><b>${Math.round(avg(s=>s.totalWaterMl))}</b><span>總攝水 ml/日${wT?`（建議 ${wT}）`:''}</span></div>
          <div><b>${Math.round(avg(s=>s.kcal))}</b><span>熱量 kcal/日${kT?`（需求約 ${kT}）`:''}</span></div>

            return `<tr><td>${fmtDate(dkey(new Date(r.ts)))}</td><td>${num(r.data.kg)}</td>
              <td>${diff==null?'—':(diff>0?'+':'')+diff}</td></tr>`;}).join('')}</table></div>`

      </div>`;
    $('#reportOut').innerHTML=html;
  },
  /* 期間內的保健品／用藥彙總。
     顯示用的名稱取「記錄當下存下來的 suppName」，所以品項後來被刪掉也還原得出來。 */
  suppSummary(catId){
    const recs = liveRecs().filter(r=>{
      if(r.type!=='supp' || r.catId!==catId) return false;
      const k=dkey(new Date(r.ts));
      return k>=this.from && k<=this.to;
    }).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const map = new Map();
    for(const r of recs){
      const d=r.data||{};
      const key = d.suppId || d.suppName || '?';
      if(!map.has(key)) map.set(key,{name:d.suppName||'（未命名）', n:0, last:r.ts,
        unit:d.unit||'', doses:[], spec:(suppById(d.suppId)||{}).spec||''});
      const a=map.get(key);
      a.n++; a.last=r.ts;
      if(d.unit) a.unit=d.unit;
      if(d.dose!=null && d.dose!=='') a.doses.push(round1(+d.dose));
    }
    const out=[...map.values()];
    for(const a of out){
      if(!a.doses.length){ a.doseText=''; continue; }
      const mn=Math.min(...a.doses), mx=Math.max(...a.doses);
      a.doseText = (mn===mx ? String(mn) : `${mn}–${mx}`) + (a.unit||'');
    }
    return out;
  },
  copyText(){
    const cat=catById(this.selCat);
    const keys=this.rangeKeys(); const n=keys.length;
    const sums=keys.map(k=>daySummary(cat.id,k));
    const avg=f=>round1(sums.reduce((a,s)=>a+f(s),0)/n);
    const kgNow=latestWeight(cat.id);
    const abnLines=[];
    keys.forEach((k,i)=>{ const s=sums[i];
      if(s.abnormal>0) abnLines.push(`  ${fmtDate(k)}：異常 ${s.abnormal} 筆`); });
    const txt=[
      `🐾 ${cat.name} 照護摘要（${this.from}～${this.to}）`,
      kgNow?`目前體重：${kgNow} kg`:null,
      `平均每日：大便 ${avg(s=>s.poop)} 次、小便 ${avg(s=>s.pee)} 次`,
      `平均攝水：${Math.round(avg(s=>s.totalWaterMl))} ml/日（喝水＋食物水分）`,
      `平均熱量：${Math.round(avg(s=>s.kcal))} kcal/日`,
      abnLines.length?`異常日：\n${abnLines.join('\n')}`:'期間內無異常記錄',
      (()=>{ const sa=this.suppSummary(cat.id);
             if(!sa.length) return liveSupps().length ? '保健品／用藥：期間內沒有記到' : null;
             return '保健品／用藥：\n'+sa.map(a=>
               `  ${a.name}${a.doseText?` ${a.doseText}`:''}　${a.n} 次（最後 ${fmtDate(dkey(new Date(a.last)))}）`).join('\n'); })(),
      `（由${appName()}產出，數值依食物庫設定換算、僅供參考）`
    ].filter(Boolean).join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast('已複製，可貼到 LINE'))
      .catch(()=>{ prompt('手動複製：', txt); });
  }
};

  searchFood(){

  /* 點常用品項：帶名稱／單位／節奏，**劑量與提醒照該節奏的預設**，
     everyDays 只有在該品項本來就有慣用間隔時才給起始值。 */
  pickSuppPreset(i){
    const p = SUPP_PRESETS[i]; if(!p) return;
    this.grabSuppInputs();
    const f = this._suppForm;
    const newKind = (p.k==='cycle') ? 'cycle' : 'daily';
    const kindChanged = f.kind !== newKind;
    f.name = p.n;
    f._presetName = p.n;         // 記住這個名字是模板帶進來的，highlight 才不會誤標
    f.kind = newKind;
    f.unit = SUPP_UNITS.includes(p.u) ? p.u : '顆';
    if(kindChanged) f.remind = (newKind==='cycle');   // 沒換節奏就別動使用者調過的提醒
    if(newKind==='cycle'){
      /* 模板自己有慣用間隔就用它；沒有的話保留使用者已經填的，都沒有才給預設。
         原本是無條件覆寫，會把剛打好的 90 天默默改回 30。 */
      f.everyDays = p.d ? p.d : (parseFloat(f.everyDays)>0 ? f.everyDays : SUPP_DEFAULT_EVERY);
    }else{
      f.everyDays = '';
    }
    f.dose = '';                 // 刻意留空：同一個名稱底下不同產品的一顆差很多
    this.renderSuppSheet();
  },
  /* 換種類時把「要不要提醒」帶回該種類的預設：
     每天吃的預設不催（沒點只代表沒記），週期性的預設要催（一個月一次最容易忘）。 */
  pickSuppKind(k){
    this.grabSuppInputs();
    const f=this._suppForm;
    if(f.kind===k){ this.renderSuppSheet(); return; }   // 點同一個不要把使用者調過的提醒設定洗掉
    f.kind=k;
    f.remind = (k==='cycle');
    if(k==='cycle' && !(parseFloat(f.everyDays)>0)) f.everyDays=SUPP_DEFAULT_EVERY;
    this.renderSuppSheet();
  },

      <div class="sec"><div class="sec-label">常用劑量（可空）</div>

        <p class="hint" style="margin:6px 0 0">填一次就好，之後每次記錄都自動帶入這個量——<b>都吃一樣的話，記錄時完全不用碰數字</b>。臨時要改就在那一筆改，不會動到這裡。</p>
      </div>
      <div class="sec"><div class="sec-label">規格／內容物（可空，自己看得懂就好）</div>

        <div class="row" style="margin-top:8px">
          <button class="btn sm ghost" onclick="Settings.searchSupp()">${icon('search',14)} Google 這個品名</button>

          <b>不會</b>把成分抓回來填——工具讀不到別的網站的內容（瀏覽器的跨站限制），而且成分數字工具也不會拿去算任何東西。</p>

  searchSupp(){
    this.grabSuppInputs();
    const n=(this._suppForm.name||'').trim();
    if(!n){ toast('先輸入名稱再查'); return; }
    window.open('https://www.google.com/search?q='+encodeURIComponent(
      '"'+n+'" 貓 成分 營養標示 每顆 建議餵食量'),'_blank');
  },
  saveSupp(){
    this.grabSuppInputs();
    const f=this._suppForm;
    const name=(f.name||'').trim();
    if(!name){ toast('請輸入名稱'); return; }
    const dose = (f.dose===''||f.dose==null) ? null : parseFloat(f.dose);
    if(dose!=null && !(dose>=0)){ toast('常用劑量請填 0 以上的數字，或留空'); return; }
    let every = parseFloat(f.everyDays);
    if(f.kind==='cycle' && !(every>0)) every = SUPP_DEFAULT_EVERY;
    const obj=this._suppEditId?DB.supps.find(x=>x.id===this._suppEditId):{id:uid()};
    obj.name=name;
    obj.kind = f.kind==='cycle' ? 'cycle' : 'daily';
    obj.dose = dose;
    obj.unit = SUPP_UNITS.includes(f.unit) ? f.unit : '顆';
    obj.everyDays = obj.kind==='cycle' ? Math.round(every) : null;
    obj.remind = !!f.remind;
    obj.spec = (f.spec||'').trim();
    upsert('supp',obj);
    Sheet.close(); toast('已儲存 ✓'); UI.rerender();
  },
  delSupp(){
    if(!confirm('刪除這個品項？（已經記下的用藥記錄不受影響，仍會留在記錄與報告裡）')) return;
    softDelete('supp',this._suppEditId);
    Sheet.close(); toast('已刪除'); UI.rerender();

  exportFoods(){
    const foods = liveFoods().map(f=>({
      name:f.name, type:f.type, moisturePct:f.moisturePct,
      kcalPer100g:f.kcalPer100g, defaultGrams:f.defaultGrams||null,
      quickGrams:Array.isArray(f.quickGrams)&&f.quickGrams.length?f.quickGrams:null,
      estimated:!!f.estimated, libId:f.libId||null
    }));
    if(!foods.length){ toast('食物庫是空的，沒有東西可以匯出'); return; }
    const payload = { kind:'catcare-foods', version:1,
      exportedAt:new Date().toISOString(), count:foods.length, foods };
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='catcare-foods-'+todayKey().replaceAll('-','')+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast(`已匯出 ${foods.length} 種食物，可以傳給別人`);
  },
  importFoods(input){
    const file=input.files[0]; input.value='';
    if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        const list = Array.isArray(d) ? d : (d && d.foods);
        if(!Array.isArray(list)) throw new Error('這不是食物庫檔案');
        let added=0, skipped=0;
        for(const o of list){
          const name=(o.name||'').trim();
          const m=parseFloat(o.moisturePct), k=parseFloat(o.kcalPer100g);
          if(!name || !(m>=0&&m<=100) || !(k>=0)){ skipped++; continue; }
          if(liveFoods().some(f=>f.name===name)){ skipped++; continue; }
          // 重新產 id：別人的 id 進到我們的資料裡，同步時可能互相覆蓋
          upsert('food',{ id:uid(), name,
            type: FOOD_TYPES.includes(o.type)?o.type:'乾糧',
            moisturePct:m, kcalPer100g:k,
            defaultGrams: parseFloat(o.defaultGrams)||null,
            quickGrams: parseQuickGrams(Array.isArray(o.quickGrams)?o.quickGrams.join(','):o.quickGrams),
            estimated: !!o.estimated, libId: o.libId||null });
          added++;
        }
        toast(added ? `已匯入 ${added} 種${skipped?`（略過 ${skipped} 種：重複或資料不全）`:''}`
                    : '沒有新的可以加入（都已經在食物庫裡，或資料不完整）');
        this.render();
      }catch(e){ toast('匯入失敗：'+e.message); }
    };
    rd.readAsText(file);
  },
  /* --- 備份 --- */
  exportJSON(){
    const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='catcare-backup-'+todayKey().replaceAll('-','')+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已匯出備份');
  },
  importJSON(input){
    const file=input.files[0]; input.value='';
    if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||!Array.isArray(d.records)) throw new Error('格式不符');
        let n=0;
        for(const kind of ['cat','food','supp','record']){
          const src=d[KIND_ARR[kind]];
          const dst=arrOfKind(kind);
          for(const o of (src||[])){
            const i=dst.findIndex(x=>x.id===o.id);
            if(i<0){ dst.push(o); markPending(kind,o.id); n++; }
            else if((o.updatedAt||0)>(dst[i].updatedAt||0)){ dst[i]=o; markPending(kind,o.id); n++; }
          }
        }
        saveDB(); Sync.schedule();
        toast(`匯入完成，合併 ${n} 筆`); UI.rerender();
      }catch(e){ toast('匯入失敗：'+e.message); }
    };
    rd.readAsText(file);
  },
  wipe(){
    if(!confirm('確定清除「這台裝置」的全部資料？（雲端試算表不會被刪）'))return;
    if(!confirm('再確認一次：本機資料將全部消失，建議先匯出備份。確定？'))return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_KEY+'_pending');
    location.reload();
  }
};

/* ============================================================
   常見市售食物挑選器
   刻意的設計：不做「一鍵全部加入」——每個人家裡吃的東西不一樣，
   全部塞進去只會讓食物庫變垃圾場。改成挑了才加，一次一筆。
   ============================================================ */
const FoodLib = {
  q:'', cat:'全部',
  cats(){ return ['全部', ...FOOD_TYPES.filter(t=>FOOD_LIBRARY.some(x=>x.type===t))]; },
  matches(){
    const q=this.q.trim().toLowerCase();
    return FOOD_LIBRARY.filter(x=>{
      if(this.cat!=='全部' && x.type!==this.cat) return false;
      if(!q) return true;
      return (x.name+' '+x.brand+' '+x.type).toLowerCase().includes(q);
    });
  },
  added(x){ return liveFoods().some(f=>f.libId===x.id || f.name===x.name); },
  open(){
    this.q=''; this.cat='全部';
    this.render();
    $('#sheetMask').classList.add('show'); document.body.style.overflow='hidden';
  },
  setQ(v){ this.q=v; this.renderList(); },
  setCat(c){ this.cat=c; this.render(); const el=$('#flQ'); if(el) el.focus(); },
  render(){
    $('#sheetBody').innerHTML=`
      <div class="sheet-head"><h2>${icon('search',20,'var(--accent)')} 常見市售食物</h2>
        <button class="sheet-close" onclick="Sheet.close()" aria-label="關閉">✕</button></div>
      <p class="hint" style="margin:0 0 10px">挑你家在吃的加進食物庫就好，不用全加。數值是 ${FOOD_LIB_VERIFIED} 查證各家官方或代理商標示，<b>加進來之後請跟你手上的包裝核對一次</b>——廠商會改配方，同系列不同口味也不一樣。</p>
      <input type="text" id="flQ" placeholder="搜尋品牌或品名…" value="${esc(this.q)}"
        style="width:100%;margin-bottom:9px" oninput="FoodLib.setQ(this.value)">
      <div class="opt-group" style="margin-bottom:10px">${this.cats().map(c=>
        `<button class="opt sm ${this.cat===c?'active':''}" onclick="FoodLib.setCat('${c}')">${c}</button>`).join('')}</div>
      <div id="flList"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn ghost" onclick="Sheet.close()">關閉</button>
      </div>`;
    this.renderList();
  },
  renderList(){
    const el=$('#flList'); if(!el) return;
    const list=this.matches();
    if(!list.length){ el.innerHTML='<p class="empty">找不到符合的。找不到你家的食物是正常的——用「＋ 新增食物」自己建，或拍包裝標示讓工具讀。</p>'; return; }
    el.innerHTML=`<div class="fl-list">${list.map(x=>{
      const on=this.added(x);
      return `<div class="fl-item">
        <div class="fl-main">
          <div class="fl-name">${esc(x.name)}</div>
          <div class="item-meta">
            <span class="chip">${esc(x.type)}</span>
            <span class="chip key">水 ${x.moisturePct}%</span>
            <span class="chip key">${x.kcalPer100g} kcal/100g</span>
            ${x.defaultGrams?`<span class="chip">常用 ${x.defaultGrams} g</span>`:''}
            <span class="chip ${x.conf==='high'?'src-hi':'src-md'}">${x.conf==='high'?'官網':'通路頁'}</span>
          </div>
          ${x.caution?`<div class="fl-caution">${esc(x.caution)}</div>`:''}
          <div class="fl-src">${esc(x.note)}・<a href="${esc(x.src)}" target="_blank" rel="noopener">看出處</a></div>
        </div>
        <div class="fl-act">${on
          ? `<span class="chip" style="color:var(--ok);border-color:var(--ok)">已加入</span>`
          : `<button class="btn sm accent" onclick="FoodLib.add('${x.id}')">＋ 加入</button>`}</div>
      </div>`;}).join('')}</div>`;
  },
  add(id){
    const x=FOOD_LIBRARY.find(o=>o.id===id); if(!x) return;
    if(this.added(x)){ toast('食物庫裡已經有了'); return; }
    upsert('food',{ id:uid(), libId:x.id, name:x.name, type:x.type,
      moisturePct:x.moisturePct, kcalPer100g:x.kcalPer100g,
      defaultGrams:x.defaultGrams||null, estimated:false });
    toast(`已加入：${x.name}`);
    this.renderList();
    if(UI.page==='settings') Settings.render();
  }
};

/* ============================================================
   OCR：拍包裝背面的「成分分析／保證分析」，在這台裝置的瀏覽器裡
   認字，挑出「水分 %」與「熱量」候選，由使用者按一下才填入。
   ------------------------------------------------------------
   誠實說明（也寫在畫面上）：
   - 照片不會上傳到任何伺服器，辨識全在瀏覽器內完成。
   - 但辨識引擎（tesseract.js）與語言模型需要第一次連網下載，
     之後由瀏覽器快取；純離線且沒載過 → 這個功能不會動，
     其餘功能不受影響。
   - 認錯字很常見，所以一律「給候選 → 你確認 → 才寫入」，
     絕不自動蓋掉你填的數字。
   ============================================================ */
const OCR_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR = {
  state:'idle',        // idle | loading | running | done | error
  msg:'', raw:'', hits:null, _lib:null,
  reset(){ this.state='idle'; this.msg=''; this.raw=''; this.hits=null; },
  boxHTML(){
    const f=Settings._foodForm||{};
    const h=this.hits;
    return `<div class="ocr-box">
      <div class="row" style="align-items:center">
        <button class="btn sm ghost" onclick="document.getElementById('ocrFile').click()">${icon('camera',14)} 拍包裝標示自動讀數字</button>
        <input type="file" id="ocrFile" accept="image/*" capture="environment" hidden onchange="OCR.handleFile(this)">
      </div>
      <p class="hint" style="margin:7px 0 0">對準包裝背面的「成分分析／保證分析」那一塊拍，照片<b>不會上傳</b>，在你手機裡認字。認錯很常見，所以要你按一下才會填進去。</p>
      ${this.state==='loading'||this.state==='running'?`<div class="ocr-prog">${esc(this.msg||'處理中…')}</div>`:''}
      ${this.state==='error'?`<div class="ocr-prog" style="color:var(--danger);font-weight:700">${esc(this.msg)}</div>`:''}
      ${this.state==='done'?`
        ${h&&(h.moisture!=null||h.kcal100!=null)?`
          <div class="ocr-hit"><span class="lbl">讀到的候選</span>
            ${h.moisture!=null?`<button class="opt sm" onclick="OCR.apply('moisturePct',${h.moisture})">含水量 ${h.moisture}% → 填入</button>`:''}
            ${h.kcal100!=null?`<button class="opt sm" onclick="OCR.apply('kcalPer100g',${h.kcal100})">${esc(h.kcalNote||'')}${h.kcal100} kcal/100g → 填入</button>`:''}
          </div>`:
          `<div class="ocr-prog">沒認出「水分％」或「kcal」的數字。可能是字太小、反光、或包裝用的字型認不出來——換個角度再拍，或直接手動填下面兩格。</div>`}
        <details style="margin-top:6px"><summary class="hint" style="cursor:pointer">看辨識到的原始文字</summary>
          <div class="ocr-raw">${esc(this.raw||'（空）')}</div></details>`:''}
    </div>`;
  },
  apply(field, val){
    Settings.grabFoodInputs();
    Settings._foodForm[field]=val;
    if(field==='kcalPer100g') Settings._foodForm.estimated=false;
    Settings.renderFoodSheet();
    toast('已填入，請跟包裝再核對一次');
  },
  async loadLib(){
    if(window.Tesseract) return window.Tesseract;
    if(this._lib) return this._lib;
    this._lib = new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=OCR_CDN;
      s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('載入後找不到辨識引擎'));
      s.onerror=()=>reject(new Error('載入辨識引擎失敗'));
      document.head.appendChild(s);
    });
    return this._lib;
  },
  async handleFile(input){
    const file=input.files&&input.files[0]; input.value='';
    if(!file) return;
    this.state='loading'; this.msg='正在準備辨識引擎（第一次要連網下載，之後就快了）…';
    this.hits=null; this.raw='';
    Settings.grabFoodInputs(); Settings.renderFoodSheet();
    try{
      const T=await this.loadLib();
      this.state='running'; this.msg='辨識中…'; Settings.renderFoodSheet();
      const res=await T.recognize(file,'eng',{
        logger:m=>{
          if(m.status==='recognizing text'){
            this.msg='辨識中… '+Math.round((m.progress||0)*100)+'%';
            const el=document.querySelector('.ocr-prog'); if(el) el.textContent=this.msg;
          }
        }
      });
      this.raw=(res&&res.data&&res.data.text||'').trim();
      this.hits=parseLabelText(this.raw);
      this.state='done'; this.msg='';
    }catch(e){
      this.state='error';
      this.msg = navigator.onLine
        ? '辨識引擎載入失敗（可能被網路擋住）。這個功能需要連外網，其他功能不受影響——請直接手動填下面兩格。'
        : '目前離線，辨識引擎還沒下載過，無法使用。請連網後再試，或直接手動填。';
    }
    Settings.grabFoodInputs(); Settings.renderFoodSheet();
  }
};
/* 從 OCR 文字裡挑「水分 %」與「熱量」。純函式，方便單獨驗證。
   支援：水分/moisture/水份 ≤ 10%、ME 3800 kcal/kg、385 kcal/100g、
   89 kcal/罐(需克數，故不採用) 等常見標法。 */
function parseLabelText(text){
  const out={moisture:null,kcal100:null,kcalNote:''};
  if(!text) return out;
  // 全形數字與百分號正規化；OCR 常把 % 認成 %／º／9%
  let t=text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
            .replace(/％/g,'%').replace(/，/g,',');
  // 去掉千分位逗號（3,977 → 3977），否則會只讀到後三碼
  let prev; do{ prev=t; t=t.replace(/(\d),(\d{3})(?!\d)/g,'$1$2'); }while(t!==prev);
  // --- 水分 ---
  const mRe=/(?:水\s*[分份]|moisture|水分含量)[^0-9%]{0,12}?([0-9]{1,2}(?:\.[0-9])?)\s*%/i;
  let m=t.match(mRe);
  if(m){ const v=parseFloat(m[1]); if(v>=0&&v<=100) out.moisture=v; }
  // --- 熱量 ---
  // 1a) 「398 kcal/100g」（數字在前）
  let k=t.match(/([0-9]{2,4}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)\s*[\/每]?\s*(?:per\s*)?100\s*g/i);
  if(k){ out.kcal100=round1(parseFloat(k[1])); return out; }
  // 1b) 「每 100 g 含熱量 398 kcal」（數字在後）
  k=t.match(/(?:每|per)\s*100\s*(?:g|公克|克)[^0-9]{0,14}([0-9]{2,4}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)/i);
  if(k){ out.kcal100=round1(parseFloat(k[1])); return out; }
  // 2) 每 kg（代謝能 ME），÷10
  k=t.match(/([0-9]{3,5}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)\s*[\/每]?\s*(?:per\s*)?(?:kg|公斤|1000\s*g)/i);
  if(k){ const v=parseFloat(k[1]); if(v>=1000&&v<=8000){ out.kcal100=round1(v/10); out.kcalNote='由 '+v+' kcal/kg 換算 → '; return out; } }
  // 3) 只出現「ME ... kcal」時取最接近的數字
  k=t.match(/(?:代謝能|metabolizable\s*energy|\bME\b)[^0-9]{0,16}([0-9]{3,5})/i);
  if(k){ const v=parseFloat(k[1]);
    if(v>=1000&&v<=8000){ out.kcal100=round1(v/10); out.kcalNote='由 '+v+' kcal/kg 換算 → '; }
    else if(v>=20&&v<=900){ out.kcal100=round1(v); }
  }
  return out;
}

/* ============================================================
   啟動
   ============================================================ */
function handleSetupLink(){
  const m=location.hash.match(/^#setup=(.+)$/);
  if(!m) return;
  try{
    const conf=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(conf.u&&conf.k){
      const had=Sync.enabled();
      if(!had || confirm('這是一個共同記錄連結，要套用它的同步設定嗎？')){
        DB.settings.syncUrl=conf.u; DB.settings.syncKey=conf.k;
        if(!DB.settings.deviceName) DB.settings.deviceName='照顧者的裝置';
        saveDB();
        toast('已連上共同記錄 ✓');
      }
    }
  }catch(e){ console.warn('setup link', e); }
  history.replaceState(null,'',location.pathname+location.search);
}
/* 標題列：品牌圖示＋（可自訂的）工具名稱 */
function appName(){
  try{ return (localStorage.getItem(APP_NAME_KEY)||'').trim() || DEFAULT_APP_NAME; }
  catch(e){ return DEFAULT_APP_NAME; }
}
function setAppName(name){
  const v=(name||'').trim();
  try{ v ? localStorage.setItem(APP_NAME_KEY,v) : localStorage.removeItem(APP_NAME_KEY); }catch(e){}
  renderBrand();
  UI.rerender();          // 畫面上其他寫著工具名稱的地方（例如空狀態的歡迎詞）也要跟著換
  toast(v ? '名稱已更新' : '已改回預設名稱');
}
function renderBrand(){
  const ico=$('#brandIcon');
  if(ico){ ico.style.color='var(--accent)';
    ico.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor">${ICONS.paw}</svg>`; }
  const nm=$('#brandName'); if(nm) nm.textContent=appName();
  document.title=appName();
}
/* PWA：加到主畫面／離線開啟。用網址開才註冊；
   本機 file:// 雙擊開時瀏覽器不允許 Service Worker，靜默略過即可。 */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').catch(e=>console.info('SW 未註冊（不影響使用）', e && e.message));
}

/* ---- ?quick=poop / ?quick=pee：給 iOS 捷徑、NFC 貼紙、桌面書籤用 ----
   開啟即記一筆，然後**立刻把參數從網址上拿掉**，否則重新整理會重複記。
   ⚠️ 已知限制：iOS 上「加到主畫面的網頁 App」與「Safari 開同一個網址」的
   localStorage 是分開的。捷徑的「打開網址」若走 Safari，記到的會是另一份資料。
   要用這個功能，請先自己實測一次（記一筆，再從主畫面圖示打開看有沒有）。 */
function handleQuickParam(){
  let q=null;
  try{ q = new URLSearchParams(location.search).get('quick'); }catch(e){ return; }
  if(!q) return;
  try{ history.replaceState(null,'',location.pathname + location.hash); }catch(e){}
  if(!Today.QUICK_TAP_TYPES.includes(q)) return;
  if(!liveCats().length){ toast('請先新增貓咪'); return; }
  /* 繞過「一鍵直記」的開關：使用者是明確用網址叫它記一筆的 */
  const saved = DB.settings.quickTap;
  DB.settings.quickTap = true;
  Today.tap(q);
  DB.settings.quickTap = saved;
}

Theme.init();
renderBrand();
loadDB();
handleSetupLink();
UI.renderNav();
UI.go('today');
handleQuickParam();
Sync.updatePill();
Sync.startPolling();
if(Sync.enabled()) Sync.run();
registerSW();
</script>
</body>
