  /* --- 食物庫匯出／匯入（分享給別人用） --- */
  exportFoods(){
    const foods = liveFoods().map(f=>({
      name:f.name, type:f.type, moisturePct:f.moisturePct,
      kcalPer100g:f.kcalPer100g, defaultGrams:f.defaultGrams||null,
      estimated:!!f.estimated, libId:f.libId||null
    }));
    if(!foods.length){ toast('食物庫是空的，沒有東西可以匯出'); return; }
    const payload = { kind:'catcare-foods', version:1,
      exportedAt:new Date().toISOString(), count:foods.length, foods };
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='catcare-foods-'+todayKey().replaceAll('-','')+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast(`已匯出 ${foods.length} 種食物，可以傳給別人`);
  },
  importFoods(input){
    const file=input.files[0]; input.value='';
    if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        const list = Array.isArray(d) ? d : (d && d.foods);
        if(!Array.isArray(list)) throw new Error('這不是食物庫檔案');
        let added=0, skipped=0;
        for(const o of list){
          const name=(o.name||'').trim();
          const m=parseFloat(o.moisturePct), k=parseFloat(o.kcalPer100g);
          if(!name || !(m>=0&&m<=100) || !(k>=0)){ skipped++; continue; }
          if(liveFoods().some(f=>f.name===name)){ skipped++; continue; }
          // 重新產 id：別人的 id 進到我們的資料裡，同步時可能互相覆蓋
          upsert('food',{ id:uid(), name,
            type: FOOD_TYPES.includes(o.type)?o.type:'乾糧',
            moisturePct:m, kcalPer100g:k,
            defaultGrams: parseFloat(o.defaultGrams)||null,
            estimated: !!o.estimated, libId: o.libId||null });
          added++;
        }
        toast(added ? `已匯入 ${added} 種${skipped?`（略過 ${skipped} 種：重複或資料不全）`:''}`
                    : '沒有新的可以加入（都已經在食物庫裡，或資料不完整）');
        this.render();
      }catch(e){ toast('匯入失敗：'+e.message); }
    };
    rd.readAsText(file);
  },
  /* --- 備份 --- */
  exportJSON(){
    const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='catcare-backup-'+todayKey().replaceAll('-','')+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已匯出備份');
  },
  importJSON(input){
    const file=input.files[0]; input.value='';
    if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||!Array.isArray(d.records)) throw new Error('格式不符');
        let n=0;
        for(const kind of ['cat','food','supp','record']){
          const src=d[KIND_MAP[kind]];
          const dst=arrOf(kind);
          for(const o of (src||[])){
            const i=dst.findIndex(x=>x.id===o.id);
            if(i<0){ dst.push(o); markPending(kind,o.id); n++; }
            else if((o.updatedAt||0)>(dst[i].updatedAt||0)){ dst[i]=o; markPending(kind,o.id); n++; }
          }
        }
        saveDB(); Sync.schedule();
        toast(`匯入完成，合併 ${n} 筆`); UI.rerender();
      }catch(e){ toast('匯入失敗：'+e.message); }
    };
    rd.readAsText(file);
  },
  wipe(){
    if(!confirm('確定清除「這台裝置」的全部資料？（雲端試算表不會被刪）'))return;
    if(!confirm('再確認一次：本機資料將全部消失，建議先匯出備份。確定？'))return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_KEY+'_pending');
    location.reload();
  }
};

/* ============================================================
   常見市售食物挑選器
   刻意的設計：不做「一鍵全部加入」——每個人家裡吃的東西不一樣，
   全部塞進去只會讓食物庫變垃圾場。改成挑了才加，一次一筆。
   ============================================================ */
const FoodLib = {
  q:'', cat:'全部',
  cats(){ return ['全部', ...FOOD_TYPES.filter(t=>FOOD_LIBRARY.some(x=>x.type===t))]; },
  matches(){
    const q=this.q.trim().toLowerCase();
    return FOOD_LIBRARY.filter(x=>{
      if(this.cat!=='全部' && x.type!==this.cat) return false;
      if(!q) return true;
      return (x.name+' '+x.brand+' '+x.type).toLowerCase().includes(q);
    });
  },
  added(x){ return liveFoods().some(f=>f.libId===x.id || f.name===x.name); },
  open(){
    this.q=''; this.cat='全部';
    this.render();
    $('#sheetMask').classList.add('show'); document.body.style.overflow='hidden';
  },
  setQ(v){ this.q=v; this.renderList(); },
  setCat(c){ this.cat=c; this.render(); const el=$('#flQ'); if(el) el.focus(); },
  render(){
    $('#sheetBody').innerHTML=`
      <div class="sheet-head"><h2>${icon('search',20,'var(--accent)')} 常見市售食物</h2>
        <button class="sheet-close" onclick="Sheet.close()" aria-label="關閉">✕</button></div>
      <p class="hint" style="margin:0 0 10px">挑你家在吃的加進食物庫就好，不用全加。數值是 ${FOOD_LIB_VERIFIED} 查證各家官方或代理商標示，<b>加進來之後請跟你手上的包裝核對一次</b>——廠商會改配方，同系列不同口味也不一樣。</p>
      <input type="text" id="flQ" placeholder="搜尋品牌或品名…" value="${esc(this.q)}"
        style="width:100%;margin-bottom:9px" oninput="FoodLib.setQ(this.value)">
      <div class="opt-group" style="margin-bottom:10px">${this.cats().map(c=>
        `<button class="opt sm ${this.cat===c?'active':''}" onclick="FoodLib.setCat('${c}')">${c}</button>`).join('')}</div>
      <div id="flList"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn ghost" onclick="Sheet.close()">關閉</button>
      </div>`;
    this.renderList();
  },
  renderList(){
    const el=$('#flList'); if(!el) return;
    const list=this.matches();
    if(!list.length){ el.innerHTML='<p class="empty">找不到符合的。找不到你家的食物是正常的——用「＋ 新增食物」自己建，或拍包裝標示讓工具讀。</p>'; return; }
    el.innerHTML=`<div class="fl-list">${list.map(x=>{
      const on=this.added(x);
      return `<div class="fl-item">
        <div class="fl-main">
          <div class="fl-name">${esc(x.name)}</div>
          <div class="item-meta">
            <span class="chip">${esc(x.type)}</span>
            <span class="chip key">水 ${x.moisturePct}%</span>
            <span class="chip key">${x.kcalPer100g} kcal/100g</span>
            ${x.defaultGrams?`<span class="chip">常用 ${x.defaultGrams} g</span>`:''}
            <span class="chip ${x.conf==='high'?'src-hi':'src-md'}">${x.conf==='high'?'官網':'通路頁'}</span>
          </div>
          ${x.caution?`<div class="fl-caution">${esc(x.caution)}</div>`:''}
          <div class="fl-src">${esc(x.note)}・<a href="${esc(x.src)}" target="_blank" rel="noopener">看出處</a></div>
        </div>
        <div class="fl-act">${on
          ? `<span class="chip" style="color:var(--ok);border-color:var(--ok)">已加入</span>`
          : `<button class="btn sm accent" onclick="FoodLib.add('${x.id}')">＋ 加入</button>`}</div>
      </div>`;}).join('')}</div>`;
  },
  add(id){
    const x=FOOD_LIBRARY.find(o=>o.id===id); if(!x) return;
    if(this.added(x)){ toast('食物庫裡已經有了'); return; }
    upsert('food',{ id:uid(), libId:x.id, name:x.name, type:x.type,
      moisturePct:x.moisturePct, kcalPer100g:x.kcalPer100g,
      defaultGrams:x.defaultGrams||null, estimated:false });
    toast(`已加入：${x.name}`);
    this.renderList();
    if(UI.page==='settings') Settings.render();
  }
};

/* ============================================================
   OCR：拍包裝背面的「成分分析／保證分析」，在這台裝置的瀏覽器裡
   認字，挑出「水分 %」與「熱量」候選，由使用者按一下才填入。
   ------------------------------------------------------------
   誠實說明（也寫在畫面上）：
   - 照片不會上傳到任何伺服器，辨識全在瀏覽器內完成。
   - 但辨識引擎（tesseract.js）與語言模型需要第一次連網下載，
     之後由瀏覽器快取；純離線且沒載過 → 這個功能不會動，
     其餘功能不受影響。
   - 認錯字很常見，所以一律「給候選 → 你確認 → 才寫入」，
     絕不自動蓋掉你填的數字。
   ============================================================ */
const OCR_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR = {
  state:'idle',        // idle | loading | running | done | error
  msg:'', raw:'', hits:null, _lib:null,
  reset(){ this.state='idle'; this.msg=''; this.raw=''; this.hits=null; },
  boxHTML(){
    const f=Settings._foodForm||{};
    const h=this.hits;
    return `<div class="ocr-box">
      <div class="row" style="align-items:center">
        <button class="btn sm ghost" onclick="document.getElementById('ocrFile').click()">${icon('camera',14)} 拍包裝標示自動讀數字</button>
        <input type="file" id="ocrFile" accept="image/*" capture="environment" hidden onchange="OCR.handleFile(this)">
      </div>
      <p class="hint" style="margin:7px 0 0">對準包裝背面的「成分分析／保證分析」那一塊拍，照片<b>不會上傳</b>，在你手機裡認字。認錯很常見，所以要你按一下才會填進去。</p>
      ${this.state==='loading'||this.state==='running'?`<div class="ocr-prog">${esc(this.msg||'處理中…')}</div>`:''}
      ${this.state==='error'?`<div class="ocr-prog" style="color:var(--danger);font-weight:700">${esc(this.msg)}</div>`:''}
      ${this.state==='done'?`
        ${h&&(h.moisture!=null||h.kcal100!=null)?`
          <div class="ocr-hit"><span class="lbl">讀到的候選</span>
            ${h.moisture!=null?`<button class="opt sm" onclick="OCR.apply('moisturePct',${h.moisture})">含水量 ${h.moisture}% → 填入</button>`:''}
            ${h.kcal100!=null?`<button class="opt sm" onclick="OCR.apply('kcalPer100g',${h.kcal100})">${esc(h.kcalNote||'')}${h.kcal100} kcal/100g → 填入</button>`:''}
          </div>`:
          `<div class="ocr-prog">沒認出「水分％」或「kcal」的數字。可能是字太小、反光、或包裝用的字型認不出來——換個角度再拍，或直接手動填下面兩格。</div>`}
        <details style="margin-top:6px"><summary class="hint" style="cursor:pointer">看辨識到的原始文字</summary>
          <div class="ocr-raw">${esc(this.raw||'（空）')}</div></details>`:''}
    </div>`;
  },
  apply(field, val){
    Settings.grabFoodInputs();
    Settings._foodForm[field]=val;
    if(field==='kcalPer100g') Settings._foodForm.estimated=false;
    Settings.renderFoodSheet();
    toast('已填入，請跟包裝再核對一次');
  },
  async loadLib(){
    if(window.Tesseract) return window.Tesseract;
    if(this._lib) return this._lib;
    this._lib = new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=OCR_CDN;
      s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('載入後找不到辨識引擎'));
      s.onerror=()=>reject(new Error('載入辨識引擎失敗'));
      document.head.appendChild(s);
    });
    return this._lib;
  },
  async handleFile(input){
    const file=input.files&&input.files[0]; input.value='';
    if(!file) return;
    this.state='loading'; this.msg='正在準備辨識引擎（第一次要連網下載，之後就快了）…';
    this.hits=null; this.raw='';
    Settings.grabFoodInputs(); Settings.renderFoodSheet();
    try{
      const T=await this.loadLib();
      this.state='running'; this.msg='辨識中…'; Settings.renderFoodSheet();
      const res=await T.recognize(file,'eng',{
        logger:m=>{
          if(m.status==='recognizing text'){
            this.msg='辨識中… '+Math.round((m.progress||0)*100)+'%';
            const el=document.querySelector('.ocr-prog'); if(el) el.textContent=this.msg;
          }
        }
      });
      this.raw=(res&&res.data&&res.data.text||'').trim();
      this.hits=parseLabelText(this.raw);
      this.state='done'; this.msg='';
    }catch(e){
      this.state='error';
      this.msg = navigator.onLine
        ? '辨識引擎載入失敗（可能被網路擋住）。這個功能需要連外網，其他功能不受影響——請直接手動填下面兩格。'
        : '目前離線，辨識引擎還沒下載過，無法使用。請連網後再試，或直接手動填。';
    }
    Settings.grabFoodInputs(); Settings.renderFoodSheet();
  }
};
/* 從 OCR 文字裡挑「水分 %」與「熱量」。純函式，方便單獨驗證。
   支援：水分/moisture/水份 ≤ 10%、ME 3800 kcal/kg、385 kcal/100g、
   89 kcal/罐(需克數，故不採用) 等常見標法。 */
function parseLabelText(text){
  const out={moisture:null,kcal100:null,kcalNote:''};
  if(!text) return out;
  // 全形數字與百分號正規化；OCR 常把 % 認成 %／º／9%
  let t=text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
            .replace(/％/g,'%').replace(/，/g,',');
  // 去掉千分位逗號（3,977 → 3977），否則會只讀到後三碼
  let prev; do{ prev=t; t=t.replace(/(\d),(\d{3})(?!\d)/g,'$1$2'); }while(t!==prev);
  // --- 水分 ---
  const mRe=/(?:水\s*[分份]|moisture|水分含量)[^0-9%]{0,12}?([0-9]{1,2}(?:\.[0-9])?)\s*%/i;
  let m=t.match(mRe);
  if(m){ const v=parseFloat(m[1]); if(v>=0&&v<=100) out.moisture=v; }
  // --- 熱量 ---
  // 1a) 「398 kcal/100g」（數字在前）
  let k=t.match(/([0-9]{2,4}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)\s*[\/每]?\s*(?:per\s*)?100\s*g/i);
  if(k){ out.kcal100=round1(parseFloat(k[1])); return out; }
  // 1b) 「每 100 g 含熱量 398 kcal」（數字在後）
  k=t.match(/(?:每|per)\s*100\s*(?:g|公克|克)[^0-9]{0,14}([0-9]{2,4}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)/i);
  if(k){ out.kcal100=round1(parseFloat(k[1])); return out; }
  // 2) 每 kg（代謝能 ME），÷10
  k=t.match(/([0-9]{3,5}(?:\.[0-9])?)\s*(?:kcal|大卡|千卡)\s*[\/每]?\s*(?:per\s*)?(?:kg|公斤|1000\s*g)/i);
  if(k){ const v=parseFloat(k[1]); if(v>=1000&&v<=8000){ out.kcal100=round1(v/10); out.kcalNote='由 '+v+' kcal/kg 換算 → '; return out; } }
  // 3) 只出現「ME ... kcal」時取最接近的數字
  k=t.match(/(?:代謝能|metabolizable\s*energy|\bME\b)[^0-9]{0,16}([0-9]{3,5})/i);
  if(k){ const v=parseFloat(k[1]);
    if(v>=1000&&v<=8000){ out.kcal100=round1(v/10); out.kcalNote='由 '+v+' kcal/kg 換算 → '; }
    else if(v>=20&&v<=900){ out.kcal100=round1(v); }
  }
  return out;
}

/* ============================================================
   啟動
   ============================================================ */
function handleSetupLink(){
  const m=location.hash.match(/^#setup=(.+)$/);
  if(!m) return;
  try{
    const conf=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(conf.u&&conf.k){
      const had=Sync.enabled();
      if(!had || confirm('這是一個共同記錄連結，要套用它的同步設定嗎？')){
        DB.settings.syncUrl=conf.u; DB.settings.syncKey=conf.k;
        if(!DB.settings.deviceName) DB.settings.deviceName='照顧者的裝置';
        saveDB();
        toast('已連上共同記錄 ✓');
      }
    }
  }catch(e){ console.warn('setup link', e); }
  history.replaceState(null,'',location.pathname+location.search);
}
/* 標題列：品牌圖示＋（可自訂的）工具名稱 */
function appName(){
  try{ return (localStorage.getItem(APP_NAME_KEY)||'').trim() || DEFAULT_APP_NAME; }
  catch(e){ return DEFAULT_APP_NAME; }
}
function setAppName(name){
  const v=(name||'').trim();
  try{ v ? localStorage.setItem(APP_NAME_KEY,v) : localStorage.removeItem(APP_NAME_KEY); }catch(e){}
  renderBrand();
  toast(v ? '名稱已更新' : '已改回預設名稱');
}
function renderBrand(){
  const ico=$('#brandIcon');
  if(ico){ ico.style.color='var(--accent)';
    ico.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor">${ICONS.paw}</svg>`; }
  const nm=$('#brandName'); if(nm) nm.textContent=appName();
  document.title=appName();
}
/* PWA：加到主畫面／離線開啟。用網址開才註冊；
   本機 file:// 雙擊開時瀏覽器不允許 Service Worker，靜默略過即可。 */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').catch(e=>console.info('SW 未註冊（不影響使用）', e && e.message));
}

Theme.init();
renderBrand();
loadDB();
handleSetupLink();
UI.renderNav();
UI.go('today');
Sync.updatePill();
Sync.startPolling();
if(Sync.enabled()) Sync.run();
registerSW();
</script>
